<!DOCTYPE html>
<html lang="ru" data-theme="light" data-palette="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nova Gaming — Cyber Lounge & PC Booking</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0914;
  --bg-gradient: radial-gradient(circle at 50% 0%, #1f1442 0%, #0b0914 70%);
  --surface: rgba(26, 21, 48, 0.7);
  --surface-hover: rgba(38, 30, 71, 0.85);
  --surface-card: rgba(22, 17, 43, 0.75);
  --border: rgba(140, 120, 240, 0.15);
  --border-focus: rgba(0, 240, 255, 0.5);
  
  --text: #f5f3ff;
  --text-muted: #948db8;
  --text-dim: #625b85;
  
  --neon-cyan: #00f0ff;
  --neon-purple: #8b5cf6;
  --neon-green: #00ffa3;
  --neon-red: #ff3366;
  --neon-gold: #ffb703;
  
  --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #00f0ff 100%);
  --accent-glow: 0 0 25px rgba(139, 92, 246, 0.4);
  --green-glow: 0 0 15px rgba(0, 255, 163, 0.3);
  --gold-glow: 0 0 18px rgba(255, 183, 3, 0.4);
  
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

#app {
  max-width: 460px;
  margin: 0 auto;
  padding: 14px 16px 98px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.anim-fade {
  animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Top Role Switcher Bar */
.top-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.role-seg {
  display: flex;
  flex: 1;
  background: rgba(18, 14, 34, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 4px;
}

.role-btn {
  flex: 1;
  background: none;
  border: 0;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}

.role-btn.active {
  background: var(--accent-grad);
  color: #fff;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
  font-weight: 700;
}

.lang-btn {
  background: rgba(18, 14, 34, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  color: var(--neon-cyan);
  font-weight: 700;
  font-size: 12px;
  border-radius: var(--radius-md);
  padding: 9px 13px;
  cursor: pointer;
}

.brand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.brand-badge {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

.brand-logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent-grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  box-shadow: var(--accent-glow);
}

.demo-banner {
  background: rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.2);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}

.demo-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
}

h2.section-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Club Cards */
.club-card {
  background: var(--surface-card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
  text-align: left;
  display: block;
  width: 100%;
}

.club-card:active {
  transform: scale(0.98);
  border-color: rgba(139, 92, 246, 0.4);
}

.club-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.club-name {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
}

.club-addr {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 12px;
}

.club-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.badge-green {
  background: rgba(0, 255, 163, 0.12);
  color: var(--neon-green);
  border: 1px solid rgba(0, 255, 163, 0.25);
}

.badge-purple {
  background: rgba(139, 92, 246, 0.15);
  color: #c4b5fd;
  border: 1px solid rgba(139, 92, 246, 0.3);
}

.badge-price {
  background: rgba(0, 240, 255, 0.12);
  color: var(--neon-cyan);
  border: 1px solid rgba(0, 240, 255, 0.25);
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

.back-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 7px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin-bottom: 12px;
}

.legend-bar {
  display: flex;
  gap: 16px;
  background: rgba(18, 14, 34, 0.6);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  margin: 12px 0 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-box {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}

.grid-main {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}

.grid-vip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.seat-btn {
  aspect-ratio: 1;
  background: rgba(26, 21, 48, 0.6);
  border: 2px solid var(--neon-green);
  border-radius: 12px;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.seat-btn::after {
  content: 'ПК';
  font-size: 9px;
  color: var(--neon-green);
  font-weight: 500;
  margin-top: 2px;
}

.seat-btn:active {
  transform: scale(0.9);
}

.seat-btn.vip {
  border-color: var(--neon-gold);
  background: rgba(255, 183, 3, 0.08);
}

.seat-btn.vip::after {
  content: 'VIP';
  color: var(--neon-gold);
}

.seat-btn.busy {
  border-color: rgba(255, 51, 102, 0.4);
  background: rgba(255, 51, 102, 0.08);
  color: var(--text-dim);
  cursor: not-allowed;
  opacity: 0.6;
}

.seat-btn.busy::after {
  content: 'ЗАНЯТ';
  color: var(--neon-red);
}

.chip-group {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.chip-btn {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: var(--radius-md);
  padding: 11px 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}

.chip-btn.active {
  background: var(--accent-grad);
  color: #fff;
  border-color: transparent;
  box-shadow: var(--accent-glow);
  font-weight: 700;
}

.styled-select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: #fff;
  padding: 13px 14px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  outline: none;
  cursor: pointer;
}

.styled-select:focus {
  border-color: var(--neon-cyan);
}

.tariff-card {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  cursor: pointer;
  color: var(--text);
}

.tariff-card.active {
  border-color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.08);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
}

.tariff-card b {
  font-family: 'JetBrains Mono', monospace;
  color: var(--neon-cyan);
  font-size: 16px;
}

.cta-btn {
  width: 100%;
  background: var(--accent-grad);
  border: 0;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.2px;
  padding: 16px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  margin-top: 14px;
  box-shadow: var(--accent-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.cta-btn:active {
  transform: scale(0.97);
}

.cta-btn.ok {
  background: linear-gradient(135deg, #00ffa3 0%, #00b4d8 100%);
  color: #05261e;
  box-shadow: var(--green-glow);
}

.cta-btn.no {
  background: rgba(255, 51, 102, 0.15);
  border: 1px solid rgba(255, 51, 102, 0.3);
  color: var(--neon-red);
}

.card-box {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 18px;
  margin-bottom: 12px;
}

.card-number-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  margin: 10px 0;
  background: rgba(0, 0, 0, 0.35);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px dashed rgba(0, 240, 255, 0.3);
  text-align: center;
}

.file-upload-zone {
  display: block;
  border: 2px dashed var(--border);
  background: rgba(26, 21, 48, 0.35);
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  margin-top: 14px;
}

.toast-msg {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #00ffa3 0%, #00b4d8 100%);
  color: #05261e;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 14px;
  box-shadow: 0 8px 24px rgba(0, 255, 163, 0.4);
  z-index: 999;
  animation: fadeIn 0.3s ease;
}

.error-text {
  color: var(--neon-red);
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
}

.status-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  margin-top: 8px;
}
.st-new { background: rgba(255, 183, 3, 0.15); color: var(--neon-gold); border: 1px solid rgba(255, 183, 3, 0.3); }
.st-ok { background: rgba(0, 255, 163, 0.15); color: var(--neon-green); border: 1px solid rgba(0, 255, 163, 0.3); }
.st-no { background: rgba(255, 51, 102, 0.15); color: var(--neon-red); border: 1px solid rgba(255, 51, 102, 0.3); }

.row-btns {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.row-btns .cta-btn {
  margin-top: 0;
}

/* Club Card Info (?) Button & Rating */
.club-head-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.club-info-btn {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.45);
  color: var(--neon-cyan);
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.22);
  transition: all 0.2s ease;
}

.club-info-btn:hover {
  background: rgba(0, 240, 255, 0.2);
  box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
  transform: translateY(-1px);
}

.club-info-btn:active {
  transform: scale(0.92);
}

.badge-gold {
  background: rgba(255, 183, 3, 0.14);
  color: var(--neon-gold);
  border: 1px solid rgba(255, 183, 3, 0.35);
}

/* Glassmorphic Club Info Modal */
@keyframes modalPop {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 5, 16, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.2s ease;
}

.info-modal {
  width: 100%;
  max-width: 410px;
  max-height: 90vh;
  overflow-y: auto;
  background: linear-gradient(165deg, rgba(24, 19, 46, 0.97) 0%, rgba(12, 9, 25, 0.99) 100%);
  border: 1px solid rgba(139, 92, 246, 0.5);
  border-radius: 26px;
  padding: 20px;
  position: relative;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 42px rgba(139, 92, 246, 0.25), 0 0 24px rgba(0, 240, 255, 0.14);
  animation: modalPop 0.26s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-close-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.modal-close-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
}

.club-modal-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding-right: 30px;
}

.club-avatar-ring {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, #00f0ff 0%, #8b5cf6 100%);
  box-shadow: 0 0 22px rgba(0, 240, 255, 0.32), 0 0 26px rgba(139, 92, 246, 0.35);
  flex-shrink: 0;
}

.club-avatar-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, rgba(0, 240, 255, 0.2), #0e0b1d 72%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -1px;
}

.club-avatar-letter {
  background: linear-gradient(135deg, #00f0ff 0%, #c084fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.club-modal-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  letter-spacing: -0.3px;
}

.club-modal-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: 13px;
}

.club-modal-stars {
  color: var(--neon-gold);
  font-weight: 800;
}

.contact-pill {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
  padding: 5px 11px;
  border-radius: 99px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.4);
  font-size: 12px;
  font-weight: 600;
}

.contact-link {
  color: #a5f3fc;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

.contact-link:hover {
  color: #fff;
}

.info-row-box {
  background: rgba(14, 11, 29, 0.82);
  border: 1px solid rgba(140, 120, 240, 0.22);
  border-radius: 14px;
  padding: 11px 13px;
  margin-bottom: 9px;
}

.live-seats-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(0, 255, 163, 0.08);
  border: 1px solid rgba(0, 255, 163, 0.32);
  border-radius: 14px;
  padding: 10px 13px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--neon-green);
}

.live-seats-box.full {
  background: rgba(255, 51, 102, 0.1);
  border-color: rgba(255, 51, 102, 0.35);
  color: #ff8fa3;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 10px var(--neon-green);
  animation: pulseDot 1.6s infinite;
  flex-shrink: 0;
}

.spec-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #e9e4ff;
  line-height: 1.35;
}

.spec-line + .spec-line {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(140, 120, 240, 0.12);
}

.spec-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 6px;
  letter-spacing: 0.4px;
  flex-shrink: 0;
}

.spec-tag-std {
  background: var(--neon-cyan);
  color: #061822;
}

.spec-tag-vip {
  background: var(--neon-gold);
  color: #261600;
}

.addr-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.map-outline-btn {
  padding: 6px 11px;
  border-radius: 10px;
  border: 1px solid rgba(0, 240, 255, 0.55);
  background: rgba(0, 240, 255, 0.08);
  color: var(--neon-cyan);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.map-outline-btn:hover {
  background: rgba(0, 240, 255, 0.18);
}

.amenities-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.amenity-pill {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(140, 120, 240, 0.22);
  border-radius: 99px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  color: #e2ddf8;
}

.rate-trigger-btn {
  width: 100%;
  background: none;
  border: 0;
  color: var(--neon-gold);
  font-size: 13px;
  font-weight: 700;
  margin-top: 12px;

    if (v === null) fields[k] = { nullValue: null };
    else if (typeof v === "boolean") fields[k] = { booleanValue: v };
    else if (typeof v === "number") {
      if (Number.isInteger(v)) fields[k] = { integerValue: String(v) };
      else fields[k] = { doubleValue: v };
    } else {
      fields[k] = { stringValue: String(v) };
    }
  }
  return { fields };
}

async function fsList(col) {
  try {
    const r = await fetch(`${FIRESTORE_BASE}/${encodeURIComponent(col)}?pageSize=200`, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    const docs = j.documents || [];
    return docs.map(d => ({ _id: (d.name || "").split("/").pop(), data: fsFromFields(d) }));
  } catch (e) {
    return null;
  }
}

async function fsGet(col, docId) {
  try {
    const r = await fetch(`${FIRESTORE_BASE}/${encodeURIComponent(col)}/${encodeURIComponent(docId)}`, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    return fsFromFields(j);
  } catch (e) {
    return null;
  }
}

async function fsSet(col, docId, data) {
  try {
    await fetch(`${FIRESTORE_BASE}/${encodeURIComponent(col)}/${encodeURIComponent(docId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fsToFields(data))
    });
  } catch (e) {}
}

function escHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getTelegramUser() {
  return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
}

function getClientUserId() {
  const tgUser = getTelegramUser();
  if (tgUser && tgUser.id) {
    return String(tgUser.id);
  }
  try {
    let uid = localStorage.getItem("nova_uid");
    if (!uid) {
      uid = "guest_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      localStorage.setItem("nova_uid", uid);
    }
    return uid;
  } catch (e) {
    return "guest_local";
  }
}

  document.documentElement.setAttribute("data-palette", S.palette);
  try {
    localStorage.setItem("nova_theme_v1", S.theme);

  } catch (e) {}
  if (tg) {
    const hdr = S.theme === "light" ? "#f2f7f3" : "#0a0d0c";
    if (tg.setHeaderColor) try { tg.setHeaderColor(hdr); } catch (e) {}
    if (tg.setBackgroundColor) try { tg.setBackgroundColor(hdr); } catch (e) {}
  }
}

// Apple Emoji Engine: renders crisp iOS 64px Apple emojis on Windows/Android/iOS with instant native fallback
const APPLE_EMOJI_RE = /(?:\p{RI}\p{RI}|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?)*)/gu;

function emojiToAppleUrl(emoji) {
  const cps = [];
  for (const ch of emoji) {
    const cp = ch.codePointAt(0);
    if (cp === 0xFE0F && emoji.indexOf("\u200D") === -1) continue;
    cps.push(cp.toString(16));
  }
  return `https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/${cps.join("-")}.png`;
}

function applyAppleEmojis(rootEl) {
  if (!rootEl || !S.appleEmoji) return;
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !APPLE_EMOJI_RE.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      APPLE_EMOJI_RE.lastIndex = 0;
      const p = node.parentNode;
      if (!p || /^(SCRIPT|STYLE|INPUT|TEXTAREA|SELECT|OPTION)$/i.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let cur;
  while ((cur = walker.nextNode())) nodes.push(cur);
  for (const textNode of nodes) {
    const txt = textNode.nodeValue;
    const frag = document.createDocumentFragment();
    let lastIdx = 0;
    APPLE_EMOJI_RE.lastIndex = 0;
    let m;
    while ((m = APPLE_EMOJI_RE.exec(txt)) !== null) {
      if (m.index > lastIdx) frag.appendChild(document.createTextNode(txt.slice(lastIdx, m.index)));
      const em = m[0];
      const img = document.createElement("img");
      img.className = "apple-emoji";
      img.alt = em;
      img.draggable = false;
      img.loading = "lazy";
      img.src = emojiToAppleUrl(em);
      img.onerror = function() { this.replaceWith(document.createTextNode(this.alt)); };
      frag.appendChild(img);
      lastIdx = m.index + em.length;
    }
    if (lastIdx < txt.length) frag.appendChild(document.createTextNode(txt.slice(lastIdx)));
    textNode.parentNode.replaceChild(frag, textNode);
  }
}

function normalizeAdminIds(list, fallbackId) {
  const out = [];

  if (Array.isArray(list)) {
    for (const raw of list) {
      const cleaned = String(raw ?? "").trim();
      if (/^\d{1,20}$/.test(cleaned) && !seen.has(cleaned)) {
        seen.add(cleaned);
        out.push(cleaned);

  if (!out.length && fallbackId) {

function applyClubHourPrice(c, priceVal, vipPriceVal, ps5PriceVal, vrPriceVal) {
  if (!c) return;
  const hp = Math.max(1000, Math.round(Number(priceVal) || Number(c.hourPrice) || (Array.isArray(c.tar) && c.tar[0] ? Number(c.tar[0][1]) : 30000)));
  const vhp = Math.max(1000, Math.round(Number(vipPriceVal) || Number(c.vipHourPrice) || Math.round(hp * 1.5)));
  const pshp = Math.max(1000, Math.round(Number(ps5PriceVal) || Number(c.ps5HourPrice) || Math.round(hp * 1.4)));
  const vrhp = Math.max(1000, Math.round(Number(vrPriceVal) || Number(c.vrHourPrice) || Math.round(hp * 1.8)));
  c.hourPrice = hp;
  c.vipHourPrice = vhp;
  c.ps5HourPrice = pshp;
  c.vrHourPrice = vrhp;
  c.tar = [[1, hp], [2, hp * 2], [3, hp * 3], [5, hp * 5]];
}

function parseSeatIds(seatVal) {
  if (Array.isArray(seatVal)) return seatVal.map(x => String(x).trim()).filter(Boolean);
  return String(seatVal || "").split(",").map(x => x.trim()).filter(Boolean);
}

function bookingHasSeat(b, singleSeatId) {
  if (!b || !b.seat) return false;
  const list = parseSeatIds(b.seat);
  const targets = parseSeatIds(singleSeatId);
  return targets.some(tId => list.includes(tId));
}

function isSeatOnMaint(c, seatId) {
  if (!c || !c.floorMap || !c.floorMap.cells) return false;
  const targets = parseSeatIds(seatId);
  return Object.values(c.floorMap.cells).some(x => x && x.maint && targets.includes(String(x.id)));
}

function getSeatTypeInClub(c, seatId) {
  const firstId = parseSeatIds(seatId)[0] || String(seatId || "");
  if (c && c.floorMap && c.floorMap.cells) {
    const found = Object.values(c.floorMap.cells).find(x => x && String(x.id) === firstId);
    if (found && found.type) return found.type;
  }
  const s = firstId.toUpperCase();
  if (s.startsWith("VR")) return "vr";
  if (s.startsWith("PS")) return "ps5";
  if (s.startsWith("V")) return "vip";
  return "pc";
}

function isVipSeatInClub(c, seatId) {
  const tp = getSeatTypeInClub(c, seatId);
  return tp === "vip" || tp === "ps5" || tp === "vr";
}

function getSingleSeatHourRate(c, singleSeatId) {
  if (!c) return 30000;
  const base = Number(c.hourPrice) || 30000;
  const tp = getSeatTypeInClub(c, singleSeatId);
  if (tp === "vr") return Number(c.vrHourPrice) || Math.round(base * 1.8);
  if (tp === "ps5") return Number(c.ps5HourPrice) || Math.round(base * 1.4);
  if (tp === "vip") return Number(c.vipHourPrice) || Math.round(base * 1.5);
  return base;
}

function getSeatHourRate(c, seatId) {
  if (!c) return 30000;
  const list = parseSeatIds(seatId);
  if (!list.length) return Number(c.hourPrice) || 30000;
  return list.reduce((sum, sId) => sum + getSingleSeatHourRate(c, sId), 0);
}

function getTariffsForSeat(c, seatId) {
  const rate = getSeatHourRate(c, seatId);
  return [[1, rate], [2, rate * 2], [3, rate * 3], [5, rate * 5]];
}

function loadBlueprintsLocal() {
  try {
    const raw = localStorage.getItem("nova_blueprints_v1");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        clubs.forEach(c => {
          if (parsed[c.id] && parsed[c.id].size && parsed[c.id].cells) {
            c.floorMap = parsed[c.id];
          }
        });
      }
    }
    const rawPrices = localStorage.getItem("nova_hourprices_v3") || localStorage.getItem("nova_hourprices_v2") || localStorage.getItem("nova_hourprices_v1");
    if (rawPrices) {
      const parsedPrices = JSON.parse(rawPrices);
      if (parsedPrices && typeof parsedPrices === "object") {
        clubs.forEach(c => {
          const entry = parsedPrices[c.id];
          if (entry && typeof entry === "object") {
            applyClubHourPrice(c, entry.std, entry.vip, entry.ps5, entry.vr);
          } else if (Number(entry) > 0) {
            applyClubHourPrice(c, Number(entry));
          }
        });
      }
    }
    const rawSettings = localStorage.getItem("nova_club_settings_v1");
    if (rawSettings) {
      const parsedSettings = JSON.parse(rawSettings);
      if (parsedSettings && typeof parsedSettings === "object") {
        clubs.forEach(c => {
          const st = parsedSettings[c.id];
          if (st && typeof st === "object") {
            if (typeof st.subPaid === "boolean") c.subPaid = st.subPaid;
            if (typeof st.suspended === "boolean") c.suspended = st.suspended;
            if (typeof st.hidden === "boolean") c.hidden = st.hidden;
            if (Array.isArray(st.adminIds)) {
              c.adminIds = normalizeAdminIds(st.adminIds, String(2000 + Number(c.id)));
            }
          }
        });
      }
    }
  } catch (e) {}
  clubs.forEach(c => {
    const baseStd = c.tar && c.tar[0] ? c.tar[0][1] : 30000;
    if (!c.hourPrice || !c.vipHourPrice || !c.ps5HourPrice || !c.vrHourPrice) {
      applyClubHourPrice(c, c.hourPrice || baseStd, c.vipHourPrice, c.ps5HourPrice, c.vrHourPrice);
    }
    if (!c.floorMap || !c.floorMap.size || !c.floorMap.cells) {
      c.floorMap = buildPresetMap(c, "arena");
    }
    c.adminIds = normalizeAdminIds(c.adminIds, String(2000 + Number(c.id)));
  });
}

function isBookingSessionEnded(b) {
  const startH = Number(b.start) || 0;
  const hrs = Number(b.hours) || 1;
  const dayOffset = Number(b.day) || 0;
  const nowH = new Date().getHours();
  if (dayOffset === 0 && (startH + hrs) <= nowH) return true;
  if (b.created && Number(b.created) > 1e12) {
    const d = new Date(Number(b.created));
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + dayOffset);
    const endTs = d.getTime() + (startH + hrs) * 3600 * 1000;
    if (Date.now() >= endTs) return true;
  }
  return false;
}

function isBookingActive(b) {
  if (!b || (b.st !== "ok" && b.st !== "new")) return false;
  if (isBookingSessionEnded(b)) return false;

  const a = abs(d, s), e = a + h;

function getClubBookableSeats(c) {
  if (!c || !c.floorMap || !c.floorMap.cells) {
    return [
      ...MAIN.map(id => ({ id, type: "pc", spec: defaultSpecForType(c, "pc") })),
      ...VIP.map(id => ({ id, type: "vip", spec: defaultSpecForType(c, "vip") }))
    ];
  }
  const out = [];
  const size = Number(c.floorMap.size) || 8;
  for (let r = 0; r < size; r++) {
    for (let col = 0; col < size; col++) {
      const cell = c.floorMap.cells[`${r}_${col}`];
      if (cell && (cell.type === "pc" || cell.type === "vip" || cell.type === "ps5" || cell.type === "vr")) {
        out.push({
          key: `${r}_${col}`,
          id: String(cell.id || `${r + 1}-${col + 1}`),
          type: cell.type,
          maint: !!cell.maint,
          spec: cell.spec || defaultSpecForType(c, cell.type)
        });
      }
    }
  }
  return out;
}

function getSeatDetails(c, seatId) {
  const list = parseSeatIds(seatId);
  const all = getClubBookableSeats(c);
  if (list.length > 1) {
    const first = all.find(x => String(x.id) === list[0]);
    const tp = first ? first.type : getSeatTypeInClub(c, list[0]);
    return {
      id: list.join(", "),
      type: tp,
      maint: list.some(s => isSeatOnMaint(c, s)),
      spec: `👥 Сквад (${list.length} мест: #${list.join(", #")}) · ${first ? first.spec : defaultSpecForType(c, tp)}`
    };
  }
  const singleId = list[0] || String(seatId);
  const found = all.find(x => String(x.id) === singleId);
  if (found) return found;
  const tp = getSeatTypeInClub(c, singleId);
  return {
    id: singleId,
    type: tp,
    maint: isSeatOnMaint(c, singleId),
    spec: defaultSpecForType(c, tp)
  };
}

function getLiveFreeSeats(clubId) {
  const c = C(clubId);
  const nowH = new Date().getHours();
  const seats = getClubBookableSeats(c);
  const stdSeats = seats.filter(s => s.type === "pc");
  const vipSeats = seats.filter(s => s.type === "vip");
  const ps5Seats = seats.filter(s => s.type === "ps5");
  const vrSeats = seats.filter(s => s.type === "vr");
  const freeStd = stdSeats.filter(s => !s.maint && !clash(clubId, s.id, 0, nowH, 1)).length;
  const freeVip = vipSeats.filter(s => !s.maint && !clash(clubId, s.id, 0, nowH, 1)).length;
  const freePs5 = ps5Seats.filter(s => !s.maint && !clash(clubId, s.id, 0, nowH, 1)).length;
  const freeVr = vrSeats.filter(s => !s.maint && !clash(clubId, s.id, 0, nowH, 1)).length;
  return {
    freeStd,
    totalStd: stdSeats.length,
    freeVip: freeVip + freePs5 + freeVr,
    totalVip: vipSeats.length + ps5Seats.length + vrSeats.length,
    onlyVipFree: freeVip,
    onlyVipTotal: vipSeats.length,
    freePs5,
    totalPs5: ps5Seats.length,

function getClubRating(c) {

  const totalSum = baseSum + votes.reduce((acc, v) => acc + Number(v.stars), 0);

function renderBlueprintGridHtml(c, isEditor) {
  if (!c.floorMap || !c.floorMap.size || !c.floorMap.cells) {
    c.floorMap = buildPresetMap(c, "arena");
  }
  const size = Number(c.floorMap.size) || 8;
  const cells = c.floorMap.cells || {};
  const nowH = new Date().getHours();
  const basePx = size <= 4 ? 58 : size <= 6 ? 46 : size <= 8 ? 38 : size <= 12 ? 32 : size <= 16 ? 28 : 24;
  const zoom = isEditor ? (Number(S.bpZoom) || 1) : 1;
  const cellPx = Math.round(basePx * zoom);
  const gapPx = size >= 16 ? 3 : 5;

  const icoMap = { pc: "🖥️", vip: "👑", ps5: "🎮", vr: "🥽" };
  let itemsHtml = "";

  for (let r = 0; r < size; r++) {
    for (let col = 0; col < size; col++) {
      const key = `${r}_${col}`;
      const cell = cells[key];
      const isFocused = isEditor && S.bpFocusKey === key;

      if (!cell || !cell.type || cell.type === "empty") {
        if (isEditor) {
          itemsHtml += `
            <div class="bp-cell bp-empty-editor ${isFocused ? "bp-focused" : ""}" onclick="onBpCellClick('${key}')" title="${r + 1}:${col + 1}">
              <span style="font-size:8px;opacity:0.45;">·</span>
            </div>`;
        } else {
          itemsHtml += `<div class="bp-cell bp-empty-player"></div>`;
        }
        continue;
      }

      if (cell.type === "wall") {
        const lbl = cell.id || "🧱";
        if (isEditor) {
          itemsHtml += `
            <div class="bp-cell bp-wall ${isFocused ? "bp-focused" : ""}" onclick="onBpCellClick('${key}')">
              <span class="bp-cell-lbl">${escHtml(lbl)}</span>
            </div>`;
        } else {
          itemsHtml += `
            <div class="bp-cell bp-wall bp-wall-player">
              <span class="bp-cell-lbl">${escHtml(lbl)}</span>
            </div>`;
        }
        continue;
      }

      const seatId = String(cell.id || `${r + 1}-${col + 1}`);
      const isMaint = !!cell.maint;
      const ico = isMaint ? "🛠️" : (icoMap[cell.type] || "🖥️");
      const specText = cell.spec || defaultSpecForType(c, cell.type);
      const hasCustomSpec = cell.spec && cell.spec !== defaultSpecForType(c, cell.type);

      if (isEditor) {
        itemsHtml += `
          <div class="bp-cell bp-${escHtml(cell.type)} ${isMaint ? "bp-maint" : ""} ${isFocused ? "bp-focused" : ""}" onclick="onBpCellClick('${key}')" title="${escHtml(seatId)}: ${escHtml(specText)}">
            ${hasCustomSpec ? `<span class="bp-custom-dot"></span>` : ""}
            <span class="bp-cell-ico">${ico}</span>
            <span class="bp-cell-lbl">${escHtml(seatId)}</span>
          </div>`;
      } else {
        const checkDay = Number(S.day) || 0;
        const minH = checkDay === 0 ? Math.max(c.open || 0, nowH) : (c.open || 0);
        const checkHour = (S.start !== null && S.start >= minH) ? Number(S.start) : minH;
        const isBusy = clash(c.id, seatId, checkDay, checkHour, 1);
        const isSquadPicked = S.squadMode && Array.isArray(S.squadSeats) && S.squadSeats.includes(seatId);
        itemsHtml += `
          <div class="bp-cell bp-${escHtml(cell.type)} ${isMaint ? "bp-maint" : (isBusy ? "bp-busy" : "")} ${isSquadPicked ? "bp-squad-picked" : ""}" onclick="onPlayerBpSeatTap('${escHtml(seatId)}')" title="${escHtml(seatId)} · ${escHtml(specText)}">
            ${hasCustomSpec ? `<span class="bp-custom-dot"></span>` : ""}
            <span class="bp-cell-ico">${isSquadPicked ? "✓" : ico}</span>
            <span class="bp-cell-lbl">${escHtml(seatId)}</span>
          </div>`;
      }
    }
  }

  const pDay = Number(S.day) || 0;
  const pMinH = pDay === 0 ? Math.max(c.open || 0, nowH) : (c.open || 0);
  const pHour = (S.start !== null && S.start >= pMinH) ? Number(S.start) : pMinH;

  return `
    <div class="blueprint-box">
      <div class="blueprint-header-bar">
        <span>📐 ${t("bpBlueprintTag")}</span>
        <span>${isEditor ? `GRID ${size}×${size}` : `${t("days")[pDay]} · ${hh(pHour)}`}</span>
      </div>
      <div class="blueprint-grid" style="grid-template-columns: repeat(${size}, minmax(${cellPx}px, 1fr)); gap: ${gapPx}px; min-width: ${size > 8 ? (size * (cellPx + gapPx)) + "px" : "100%"};">
        ${itemsHtml}
      </div>
    </div>
  `;
}

function setSquadMode(on) {
  S.squadMode = !!on;
  if (!S.squadMode) S.squadSeats = [];
  haptic();
  render();
}

function clearSquadSeats() {
  S.squadSeats = [];
  haptic();
  render();
}

function setPlayerMapTime(dayIdx, hourVal) {
  const c = C(S.club);
  S.day = Number(dayIdx) || 0;
  const nowH = new Date().getHours();
  const openH = (c && c.open) || 0;
  const closeH = (c && c.close) || 24;
  const minH = S.day === 0 ? Math.max(openH, nowH) : openH;
  S.start = hourVal !== null && hourVal >= minH ? Number(hourVal) : Math.min(minH, closeH - 1);
  if (c && Array.isArray(S.squadSeats) && S.squadSeats.length) {
    S.squadSeats = S.squadSeats.filter(sId => !isSeatOnMaint(c, sId) && !clash(c.id, sId, S.day, S.start, 1));
  }
  S.err = "";
  haptic();
  render();
}

function pickAllFreeVipForSquad(clubId) {
  const c = C(clubId);
  if (!c) return;
  const nowH = new Date().getHours();
  const checkDay = Number(S.day) || 0;
  const minH = checkDay === 0 ? Math.max(c.open || 0, nowH) : (c.open || 0);
  const checkHour = (S.start !== null && S.start >= minH) ? Number(S.start) : minH;
  const freeVips = getClubBookableSeats(c)
    .filter(s => s.type === "vip" && !s.maint && !clash(c.id, s.id, checkDay, checkHour, 1))
    .map(s => String(s.id));
  if (!freeVips.length) {
    haptic("warning");
    showToast(t("noFreeNow"));
    return;
  }
  S.squadMode = true;
  S.squadSeats = freeVips;
  haptic("success");
  render();
}

function onPlayerBpSeatTap(seatId) {
  const c = C(S.club);
  if (!c) return;
  if (isSeatOnMaint(c, seatId)) {
    haptic("warning");
    showToast(t("maintToastPlayer"));
    return;
  }
  const nowH = new Date().getHours();
  const checkDay = Number(S.day) || 0;
  const minH = checkDay === 0 ? Math.max(c.open || 0, nowH) : (c.open || 0);
  const checkHour = (S.start !== null && S.start >= minH) ? Number(S.start) : minH;

  if (clash(c.id, seatId, checkDay, checkHour, 1)) {
    haptic("warning");
    showToast(t("seatBusyToast"));
    return;
  }

  if (!S.squadMode) {
    openSeat(seatId);
    return;
  }
  const idx = S.squadSeats.indexOf(String(seatId));
  if (idx >= 0) {
    S.squadSeats.splice(idx, 1);
  } else {
    S.squadSeats.push(String(seatId));
  }
  haptic();
  render();
}

function proceedSquadBooking() {
  if (!S.squadSeats || !S.squadSeats.length) return;
  openSeat(S.squadSeats.join(", "));
}

          <button class="back-btn" style="margin-bottom:0;border-color:rgba(0,240,255,0.45);color:var(--neon-cyan);" onclick="openClubInfo(${c.id}, event)">? ${t("aboutClub")}</button>
        </div>

      <p style="color:var(--neon-green);font-size:12px;font-weight:700;margin-top:4px;">
        🟢 ${t("freeNow")}: ${live.freeStd} PC · ${live.onlyVipFree} VIP${live.totalPs5 ? ` · ${live.freePs5} PS5` : ""}${live.totalVr ? ` · ${live.freeVr} VR` : ""}

      <div class="legend-bar" style="flex-wrap:wrap;gap:10px;">

        <div class="legend-item"><div class="legend-box" style="border:2px solid #d946ef"></div> 🥽 VR · <b>${fm(c.vrHourPrice || Math.round(minHour(c) * 1.8))}</b></div>

      <div class="card-box" style="padding:10px 12px;margin:10px 0 8px;border-color:rgba(0,240,255,0.3);">

  S.day = dayIdx;
  S.start = null;
  S.tar = null;
  S.err = "";
  haptic();
  render();
}

function selectSeatBookingHour(hourVal) {
  S.start = hourVal;
  S.err = "";
  haptic();
  render();
}

function seatView() {
  const c = C(S.club);
  if (!c) { S.view = "home"; return home(); }
  const nowH = new Date().getHours();
  const openH = c.open || 0;
  const closeH = c.close || 24;
  const minValidH = S.day === 0 ? Math.max(openH, nowH) : openH;

  // Находим все доступные (свободные) часы для выбранного места/сквада
  const freeHours = [];
  for (let h = minValidH; h < closeH; h++) {
    if (!clash(c.id, S.seat, S.day, h, 1)) {
      freeHours.push(h);
    }
  }

  // Если текущий S.start не выбран, в прошлом или занят — авто-прыгаем на первый свободный час!
  if (S.start === null || S.start < minValidH || clash(c.id, S.seat, S.day, S.start, 1)) {
    S.start = freeHours.length ? freeHours[0] : null;
  }

  const ex = bk.filter(b => b.club === c.id && bookingHasSeat(b, S.seat) && isBookingActive(b))
    .map(b => `<p style="color:${b.st === "new" ? "var(--neon-gold)" : "var(--neon-red)"};font-size:12px;margin-top:2px;">${b.st === "new" ? "⏳" : "⚠️"} ${t("busyAt")} (#${escHtml(b.seat)}): ${rng(b)}${b.st === "new" ? " (" + t("pendingTag") + ")" : ""}</p>`).join("");

  const days = t("days").map((d, i) => `
    <button class="chip-btn ${S.day === i ? 'active' : ''}" onclick="selectSeatBookingDay(${i})">${d}</button>
  `).join("");

  // Визуальная неоновая сетка времени (никаких страшных серых <select> с прошедшими часами!)
  let timeGridHtml = "";
  for (let h = minValidH; h < closeH; h++) {
    const isBusyH = clash(c.id, S.seat, S.day, h, 1);
    const isPicked = S.start === h && !isBusyH;
    if (isBusyH) {
      timeGridHtml += `
        <button disabled style="background:rgba(255,51,102,0.1);border:1px dashed rgba(255,51,102,0.35);color:rgba(255,143,163,0.45);border-radius:11px;padding:10px 4px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:not-allowed;text-decoration:line-through;">
          🔴 ${hh(h)}
        </button>
      `;
    } else {
      timeGridHtml += `
        <button onclick="selectSeatBookingHour(${h})" style="background:${isPicked ? "linear-gradient(135deg, rgba(124,58,237,0.45), rgba(0,240,255,0.28))" : "rgba(18,14,36,0.85)"};border:1.5px solid ${isPicked ? "#00f0ff" : "rgba(0,255,163,0.35)"};color:${isPicked ? "#fff" : "#d1fae5"};box-shadow:${isPicked ? "0 0 14px rgba(0,240,255,0.32)" : "none"};border-radius:11px;padding:10px 4px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:800;cursor:pointer;transition:all 0.15s ease;">
          ${isPicked ? "⚡" : "🟢"} ${hh(h)}
        </button>
      `;
    }
  }

  const seatTars = getTariffsForSeat(c, S.seat);
  // Если выбранный тариф перекрывается следующей бронью — сбрасываем или выбираем первый доступный
  if (S.tar !== null && S.start !== null && seatTars[S.tar]) {
    const curHrs = seatTars[S.tar][0];
    if (clash(c.id, S.seat, S.day, S.start, curHrs) || closedAt(c.id, S.seat, S.day, S.start, curHrs)) {
      S.tar = null;
    }
  }
  if (S.tar === null && S.start !== null) {
    const firstValidIdx = seatTars.findIndex(x => !clash(c.id, S.seat, S.day, S.start, x[0]) && !closedAt(c.id, S.seat, S.day, S.start, x[0]));
    if (firstValidIdx >= 0) S.tar = firstValidIdx;
  }

  const tars = seatTars.map((x, i) => {
    const hrs = x[0];
    const blocked = S.start === null || clash(c.id, S.seat, S.day, S.start, hrs) || closedAt(c.id, S.seat, S.day, S.start, hrs);
    if (blocked) {
      return `
        <div class="tariff-card" style="opacity:0.42;cursor:not-allowed;border-color:rgba(255,51,102,0.3);background:rgba(28,14,30,0.45);">
          <span>🔒 <b>${hrs} ${t("h")}</b> <span style="font-size:11px;color:#ff8fa3;">(${t("tarBlockedHint")})</span></span>
          <b style="color:var(--text-muted);text-decoration:line-through;">${fm(x[1])}</b>
        </div>
      `;
    }
    const endTimeStr = S.start !== null ? ` (${hh(S.start)}–${hh(S.start + hrs)})` : "";
    return `
      <div class="tariff-card ${S.tar === i ? 'active' : ''}" onclick="S.tar=${i};S.err='';haptic();render()">
        <span>⏱️ <b>${hrs} ${t("h")}</b> ${t("playTime")}<span style="font-size:11px;color:var(--text-muted);">${endTimeStr}</span></span>
        <b>${fm(x[1])}</b>
      </div>
    `;
  }).join("");

  const seatInfo = getSeatDetails(c, S.seat);
  const typeMeta = {
    pc: { ico: "🖥️", lbl: "PC STANDART", cls: "badge-green" },
    vip: { ico: "👑", lbl: "VIP BOOTCAMP", cls: "badge-gold" },
    ps5: { ico: "🎮", lbl: "PLAYSTATION 5", cls: "badge-purple" },
    vr: { ico: "🥽", lbl: "VR ARENA", cls: "badge-purple" }
  }[seatInfo.type] || { ico: "🖥️", lbl: "PC", cls: "badge-green" };

  return `
    <div class="anim-fade">
      <button class="back-btn" onclick="go('club')">${t("back")}</button>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
        <h1 style="font-size:22px;font-weight:800;margin:0;">${escHtml(c.name)} · ${t("seatPlace")}${escHtml(S.seat)}</h1>
        <span class="badge ${typeMeta.cls}">${typeMeta.ico} ${typeMeta.lbl} · ${fm(getSeatHourRate(c, S.seat))} ${t("per")}</span>
      </div>
      <div class="info-row-box" style="margin:8px 0 10px;border-color:rgba(0,240,255,0.28);">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:2px;">⚡ ${t("bpCustomSpecTitle")}:</div>
        <div style="font-size:13px;font-weight:700;color:var(--neon-cyan);font-family:'JetBrains Mono',monospace;">${escHtml(seatInfo.spec)}</div>
      </div>
      ${ex}

      <h2 class="section-title">📅 ${t("bookDate")}</h2>
      <div class="chip-group">${days}</div>

      <h2 class="section-title">⏰ ${t("start")}</h2>
      ${freeHours.length ? `
        <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:7px;margin-bottom:14px;">
          ${timeGridHtml}
        </div>
      ` : `
        <div class="card-box" style="border-color:rgba(255,51,102,0.45);color:#ff8fa3;font-size:12px;text-align:center;padding:14px;">
          ⚠️ ${t("noFreeHoursToday")}
        </div>
      `}

      <h2 class="section-title">⚡ ${t("tariff")}</h2>
      ${tars}

      ${S.err ? `<div class="error-text">❌ ${escHtml(S.err)}</div>` : ""}

      <button class="cta-btn" ${S.start === null || S.tar === null ? "disabled style='opacity:0.45;cursor:not-allowed;'" : ""} onclick="toPay()">${t("next")}</button>
    </div>
  `;
}

  }
  if (S.mh < openH || S.mh >= closeH) {
    S.mh = Math.min(minValidH, closeH - 1);

          <button class="receipt-mini-btn" style="font-size:11px;padding:3px 9px;" onclick="adminSetRadarNow()">${t("adminNowBtn")}</button>

          </div>
          <span class="badge ${isMaintNow ? "badge-yellow" : (isBusyAtRadar ? "badge-red" : "badge-green")}">

          ⚡ ${escHtml(selectedSeatInfo.spec)}
        </div>

        ${S.err ? `<div class="error-text" style="margin-bottom:8px;">❌ ${escHtml(S.err)}</div>` : ""}

        ${isBusyAtRadar ? `
          <button class="cta-btn ok" style="margin-bottom:10px;padding:11px;" onclick="adminFreeSeatAtTime(${curClub.id}, '${escHtml(S.ms)}', ${S.md}, ${S.mh})">

        ` : (!isMaintNow ? `
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">${t("adminQuickSit")} (${t("days")[S.md]}, с ${hh(S.mh)}):</div>

          <div class="stat-label">💰 ${t("adminTotalRevLabel")}</div>
          <div class="stat-value" style="color:var(--neon-cyan);font-size:15px;">${fm(clubTotalRev)}</div>

}

function renderAdminBlueprintHtml(c) {
  if (!c.floorMap || !c.floorMap.size || !c.floorMap.cells) {
    c.floorMap = buildPresetMap(c, "arena");
  }
  const size = Number(c.floorMap.size) || 8;
  const cells = c.floorMap.cells || {};
  const basePx = size <= 4 ? 58 : size <= 6 ? 46 : size <= 8 ? 38 : size <= 12 ? 32 : size <= 16 ? 28 : 24;
  const gapPx = size >= 16 ? 3 : 5;
  const icoMap = { pc: "🖥️", vip: "👑", ps5: "🎮", vr: "🥽" };
  let itemsHtml = "";

  for (let r = 0; r < size; r++) {
    for (let col = 0; col < size; col++) {
      const key = `${r}_${col}`;
      const cell = cells[key];
      if (!cell || !cell.type || cell.type === "empty") {
        itemsHtml += `<div class="bp-cell bp-empty-player"></div>`;
        continue;
      }
      if (cell.type === "wall") {
        itemsHtml += `
          <div class="bp-cell bp-wall bp-wall-player">
            <span class="bp-cell-lbl">${escHtml(cell.id || "🧱")}</span>
          </div>`;
        continue;
      }
      const seatId = String(cell.id || `${r + 1}-${col + 1}`);
      const isMaint = !!cell.maint;
      const ico = isMaint ? "🛠️" : (icoMap[cell.type] || "🖥️");
      const isBusy = clash(c.id, seatId, S.md, S.mh, 1);
      const isSelected = String(S.ms) === String(seatId);
      itemsHtml += `
        <div class="bp-cell bp-${escHtml(cell.type)} ${isMaint ? "bp-maint" : (isBusy ? "bp-busy" : "")} ${isSelected ? "bp-focused" : ""}" onclick="adminSelectSeat('${escHtml(seatId)}')">
          <span class="bp-cell-ico">${ico}</span>
          <span class="bp-cell-lbl">${escHtml(seatId)}</span>
        </div>`;
    }
  }

  return `
    <div class="blueprint-box">
      <div class="blueprint-header-bar">
        <span>📐 RADAR // ${escHtml(c.name)}</span>
        <span>${t("days")[S.md]} · ${hh(S.mh)}</span>
      </div>
      <div class="blueprint-grid" style="grid-template-columns: repeat(${size}, minmax(${basePx}px, 1fr)); gap: ${gapPx}px; min-width: ${size > 8 ? (size * (basePx + gapPx)) + "px" : "100%"};">
        ${itemsHtml}
      </div>
    </div>
  `;
}

function adminSelectSeat(seatId) {
  S.ms = String(seatId);
  S.err = "";
  haptic();
  render();
}

function adminSetRadarNow() {
  S.md = 0;
  S.mh = new Date().getHours();
  S.err = "";
  haptic();
  render();
}

async function toggleSeatMaintenance(clubId, seatId) {
  const c = C(clubId);
  if (!c || !c.floorMap || !c.floorMap.cells) return;
  const entry = Object.values(c.floorMap.cells).find(x => x && String(x.id) === String(seatId));
  if (!entry) return;
  entry.maint = !entry.maint;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic(entry.maint ? "warning" : "success");
  showToast(entry.maint ? `${t("adminMaintOnToast")} (#${seatId})` : `${t("adminMaintOffToast")} (#${seatId})`);
  render();
}

async function adminQuickOccupy(clubId, seatId, hrsCount) {
  S.ms = String(seatId);
  S.mn = Number(hrsCount) || 1;
  await manual(clubId);
  if (!S.err) {
    showToast(`${t("adminSeatOccupiedToast")} (#${seatId} · ${hrsCount} ${t("h")})`);
  }
}

async function adminCancelBookingById(bId) {
  await decide(bId, "no");
  showToast(t("adminSeatFreedToast"));
}

async function adminFreeSeatAtTime(clubId, seatId, dayIdx, hourVal) {
  const a = abs(dayIdx, hourVal), e = a + 1;
  const targets = bk.filter(
    b => b.club === clubId && bookingHasSeat(b, seatId) && isBookingActive(b) && a < abs(b.day, b.start) + b.hours && abs(b.day, b.start) < e
  );
  for (const item of targets) {
    await decide(item.id, "no");
  }
  showToast(`${t("adminSeatFreedToast")} (#${seatId})`);
  render();
}

function bkTab(k, clubId) {
  return bk
    .filter(b => {
      if (b.club !== clubId) return false;
      if (k === "active") return b.st === "ok" && isBookingActive(b);
      if (k === "no") return b.st === "no" || b.st === "exp";
      return b.st === k;
    })
    .slice()
    .sort((a, b) => (b.created || 0) - (a.created || 0) || String(b.id).localeCompare(String(a.id)));
}

function getBookingRevenue(b) {
  if (!b) return 0;
  const c = C(b.club);
  const hrs = Number(b.hours) || 1;
  if (c) {
    return Math.round(getSeatHourRate(c, b.seat) * hrs);
  }
  if (Number(b.price) > 0) return Number(b.price);
  return 0;
}

    }).join("") || `<p style="color:var(--text-muted);text-align:center;padding:24px 0;">${t("empty")}</p>`;

    return `
      <div class="anim-fade">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">💳 ${t("subsTitle")}</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">${t("subsHint")}</p>
        ${subCards}
      </div>
    `;
  }

  // Вкладка 4: Конструктор архитектурного чертежа зала (сетка 2x2 .. 32x32, проходы, PC, VIP, PS5, VR и детали железа)
  if (S.sysTab === "map") {
    const bpClub = C(S.bpClubId) || clubs.find(x => x.ok) || clubs[0];
    if (!bpClub.floorMap || !bpClub.floorMap.size || !bpClub.floorMap.cells) {
      bpClub.floorMap = buildPresetMap(bpClub, "arena");
    }
    const curSize = Number(bpClub.floorMap.size) || 8;
    const clubSelectOpts = clubs.map(c => `
      <option value="${c.id}" ${c.id === bpClub.id ? "selected" : ""}>🏢 ${escHtml(c.name)} (${escHtml(c.addr)})</option>
    `).join("");

    const sizeChips = BP_SIZES.map(sz => `
      <button class="bp-size-chip ${curSize === sz ? "active" : ""}" onclick="setBpSize(${sz})">${sz}×${sz}</button>
    `).join("");

    const tools = [
      ["empty", "bpToolEmpty"],
      ["pc", "bpToolPc"],
      ["vip", "bpToolVip"],
      ["ps5", "bpToolPs5"],
      ["vr", "bpToolVr"],
      ["wall", "bpToolWall"],
      ["inspect", "bpToolInspect"]
    ].map(([k, lblKey]) => `
      <button class="bp-tool-btn ${S.bpTool === k ? "active" : ""}" onclick="setBpTool('${k}')">
        ${t(lblKey)}
      </button>
    `).join("");

    const focusedCell = S.bpFocusKey && bpClub.floorMap.cells[S.bpFocusKey];
    const focusedHtml = focusedCell ? `
      <div class="card-box anim-fade" style="border-color:var(--neon-cyan);margin-top:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <b style="font-size:14px;color:var(--neon-cyan);">🔧 ${t("bpCustomSpecTitle")} (${escHtml(focusedCell.id || S.bpFocusKey)})</b>
          <span class="badge badge-purple">${escHtml(String(focusedCell.type).toUpperCase())}</span>
        </div>
        <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">${t("bpSeatLabel")}:</label>
        <input id="bp_seat_id_inp" class="styled-select" style="margin-bottom:8px;" value="${escHtml(focusedCell.id || "")}" placeholder="1, V1, PS1, VR1, BAR">
        ${focusedCell.type !== "wall" ? `
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">${t("bpSeatSpecs")}:</label>
          <input id="bp_seat_spec_inp" class="styled-select" style="margin-bottom:10px;" value="${escHtml(focusedCell.spec || defaultSpecForType(bpClub, focusedCell.type))}" placeholder="RTX 4090 · 360Hz Zowie · Superlight 2">
          <button class="receipt-mini-btn" style="width:100%;padding:8px;margin-bottom:8px;font-size:12px;" onclick="toggleSeatMaintenance(${bpClub.id}, '${escHtml(focusedCell.id)}')">
            ${focusedCell.maint ? t("adminMaintRestoreBtn") : t("adminMaintSetBtn")}
          </button>
        ` : ""}
        <div class="row-btns" style="margin-top:4px;">
          <button class="cta-btn ok" style="padding:10px;" onclick="saveBpSeatCustomSpec()">${t("bpSaveSeat")}</button>
          <button class="cta-btn no" style="padding:10px;" onclick="deleteBpFocusedCell()">⬜ ${t("bpToolEmpty")}</button>
        </div>
      </div>
    ` : "";

    const live = getLiveFreeSeats(bpClub.id);

    return `
      <div class="anim-fade">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:6px;">📐 ${t("bpTitle")}</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">${t("bpHint")}</p>

        <select class="styled-select" style="margin-bottom:10px;" onchange="setBpClub(+this.value)">
          ${clubSelectOpts}
        </select>

        <div class="card-box" style="padding:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${t("bpGridSize")}:</span>
            <div style="display:flex;gap:4px;">
              <button class="receipt-mini-btn" style="padding:2px 7px;font-size:11px;" onclick="setBpZoom(0.85)">−</button>
              <button class="receipt-mini-btn" style="padding:2px 7px;font-size:11px;" onclick="setBpZoom(1)">100%</button>
              <button class="receipt-mini-btn" style="padding:2px 7px;font-size:11px;" onclick="setBpZoom(1.35)">+</button>
            </div>
          </div>
          <div class="bp-size-bar">${sizeChips}</div>

          <div class="bp-palette">${tools}</div>

          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
            <button class="receipt-mini-btn" style="font-size:11px;" onclick="applyBpPreset('arena')">${t("bpPresetArena")}</button>
            <button class="receipt-mini-btn" style="font-size:11px;" onclick="applyBpPreset('bootcamp')">${t("bpPresetBootcamp")}</button>
            <button class="receipt-mini-btn" style="font-size:11px;border-color:rgba(255,51,102,0.45);color:#ff8fa3;" onclick="applyBpPreset('clear')">${t("bpPresetClear")}</button>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);padding:0 4px;">
          <span>🖥️ PC: <b style="color:#fff;">${live.totalStd}</b> · 👑 VIP: <b style="color:#fff;">${live.onlyVipTotal}</b> · 🎮 PS5: <b style="color:#fff;">${live.totalPs5}</b> · 🥽 VR: <b style="color:#fff;">${live.totalVr}</b></span>
          <button class="receipt-mini-btn" style="font-size:11px;" onclick="previewClubFromBp(${bpClub.id})">👁️ Предпросмотр</button>
        </div>

        ${renderBlueprintGridHtml(bpClub, true)}
        ${focusedHtml}
      </div>
    `;
  }

  // Вкладка 3: Аналитика прибыли владельцев каждого клуба
  const connected = clubs.filter(c => c.ok);
  const statsPerClub = connected.map(c => {
    const clubBks = bk.filter(b => Number(b.club) === Number(c.id) && b.st === "ok");
    const onlineBks = clubBks.filter(b => b.by === "user");
    const manualBks = clubBks.filter(b => b.by === "manual");
    const revenue = clubBks.reduce((acc, b) => acc + getBookingRevenue(b), 0);
    const hours = clubBks.reduce((acc, b) => acc + (Number(b.hours) || 1), 0);
    const avg = clubBks.length ? Math.round(revenue / clubBks.length) : 0;
    return {
      club: c,
      totalCount: clubBks.length,
      onlineCount: onlineBks.length,
      manualCount: manualBks.length,
      revenue,
      hours,
      avg
    };
  }).sort((a, b) => b.revenue - a.revenue);

  const totalPlatformRev = statsPerClub.reduce((acc, s) => acc + s.revenue, 0);
  const totalPlatformSessions = statsPerClub.reduce((acc, s) => acc + s.totalCount, 0);

  const statCards = statsPerClub.map(s => {
    const sharePct = totalPlatformRev > 0 ? Math.round((s.revenue / totalPlatformRev) * 100) : 0;
    return `
      <div class="card-box anim-fade">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div>
            <b style="font-size:16px;">${escHtml(s.club.name)}</b>
            <p style="font-size:11px;color:var(--text-muted);margin-top:2px;">📍 ${escHtml(s.club.addr)}</p>
          </div>
          <span class="badge ${s.club.suspended ? "badge-red" : "badge-green"}">
            ${s.club.suspended ? "⛔" : "🟢"} ${sharePct}%
          </span>
        </div>

        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-size:12px;color:var(--text-muted);">${t("ownerProfit")}:</span>
          <span style="font-size:19px;font-weight:800;color:var(--neon-green);font-family:'JetBrains Mono',monospace;">
            ${fm(s.revenue)}
          </span>
        </div>

        <div class="analytics-bar-track">
          <div class="analytics-bar-fill" style="width:${Math.max(4, sharePct)}%;"></div>
        </div>

        <div class="analytics-grid">
          <div class="analytics-cell">${t("onlineBkCount")}<b>${s.onlineCount}</b></div>
          <div class="analytics-cell">${t("manualBkCount")}<b>${s.manualCount}</b></div>
          <div class="analytics-cell">${t("hoursSold")}<b>${s.hours} ${t("h")}</b></div>
          <div class="analytics-cell">${t("avgCheck")}<b>${fm(s.avg)}</b></div>
        </div>
      </div>
    `;
  }).join("");

  return `
    <div class="anim-fade">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">📊 ${t("statTitle")}</h1>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">${t("statHint")}</p>

      <div class="history-stats">
        <div class="stat-card">
          <div class="stat-label">💰 ${t("totalNetRev")}</div>
          <div class="stat-value" style="color:var(--neon-green);font-size:15px;">${fm(totalPlatformRev)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">🎟️ ${t("totalNetSessions")}</div>
          <div class="stat-value" style="color:var(--neon-cyan);">${totalPlatformSessions}</div>
        </div>
      </div>

      ${statCards}
    </div>
  `;
}

}

function setBpZoom(val) {
  S.bpZoom = val;
  haptic();

}

async function setBpSize(newSize) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  if (!c.floorMap) c.floorMap = buildPresetMap(c, "arena");
  c.floorMap.size = newSize;
  // Удаляем клетки, выходящие за пределы новой сетки
  const cleaned = {};
  Object.entries(c.floorMap.cells || {}).forEach(([k, val]) => {
    const [r, col] = k.split("_").map(Number);
    if (r < newSize && col < newSize) cleaned[k] = val;
  });
  c.floorMap.cells = cleaned;
  S.bpFocusKey = null;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  render();
}

async function applyBpPreset(presetKey) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  c.floorMap = buildPresetMap(c, presetKey);
  S.bpFocusKey = null;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  showToast(t("bpSavedToast"));
  render();
}

function nextSeatIdForType(c, type) {
  const cells = Object.values((c && c.floorMap && c.floorMap.cells) || {});
  const prefixMap = { pc: "", vip: "V", ps5: "PS", vr: "VR" };
  const pref = prefixMap[type] ?? "";
  if (type === "wall") return "WALL";
  const used = new Set(cells.filter(x => x && x.type === type).map(x => String(x.id)));
  for (let i = 1; i <= 1024; i++) {
    const candidate = `${pref}${i}`;
    if (!used.has(candidate)) return candidate;
  }
  return `${pref}1`;
}

async function onBpCellClick(key) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  if (!c.floorMap || !c.floorMap.cells) c.floorMap = buildPresetMap(c, "arena");

  if (S.bpTool === "inspect") {
    if (c.floorMap.cells[key]) {
      S.bpFocusKey = key;
      haptic();
      render();
    }
    return;
  }

  if (S.bpTool === "empty") {
    delete c.floorMap.cells[key];
    if (S.bpFocusKey === key) S.bpFocusKey = null;
  } else {
    const existing = c.floorMap.cells[key];
    if (existing && existing.type === S.bpTool) {
      // Повторный клик тем же инструментом открывает инспектор деталей этого места
      S.bpFocusKey = key;
    } else {
      const newId = nextSeatIdForType(c, S.bpTool);
      c.floorMap.cells[key] = {
        type: S.bpTool,
        id: newId,
        spec: defaultSpecForType(c, S.bpTool)
      };
      S.bpFocusKey = key;
    }
  }
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic();
  render();
}

async function saveBpSeatCustomSpec() {
  const c = C(S.bpClubId) || clubs[0];
  if (!c || !S.bpFocusKey || !c.floorMap || !c.floorMap.cells[S.bpFocusKey]) return;
  const cell = c.floorMap.cells[S.bpFocusKey];
  const idInp = $("bp_seat_id_inp");
  const specInp = $("bp_seat_spec_inp");
  if (idInp && idInp.value.trim()) cell.id = idInp.value.trim();
  if (specInp && specInp.value.trim()) cell.spec = specInp.value.trim();
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  showToast(t("bpSavedToast"));
  render();
}

async function deleteBpFocusedCell() {
  const c = C(S.bpClubId) || clubs[0];
  if (!c || !S.bpFocusKey || !c.floorMap) return;
  delete c.floorMap.cells[S.bpFocusKey];
  S.bpFocusKey = null;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("warning");
  render();
}

let toastTimer = null;
function showToast(msg) {
  S.toast = msg;
  if (toastTimer) clearTimeout(toastTimer);
  render();
  toastTimer = setTimeout(() => {
    S.toast = "";
    toastTimer = null;
    if (S.settingsClubId !== null) {
      document.querySelectorAll(".toast-msg").forEach(el => el.remove());
    } else {
      render();

  }, 3000);
}

function isClubSettingsDirty() {
  if (S.settingsClubId === null || !S.settingsDraft) return false;
  const c = C(S.settingsClubId);
  if (!c) return false;
  const d = S.settingsDraft;
  const origAdmins = normalizeAdminIds(c.adminIds, String(2000 + Number(c.id)));
  const curStd = Number(c.hourPrice) || Math.round(minHour(c));
  const curVip = Number(c.vipHourPrice) || Math.round(curStd * 1.5);
  const curPs5 = Number(c.ps5HourPrice) || Math.round(curStd * 1.4);
  const curVr = Number(c.vrHourPrice) || Math.round(curStd * 1.8);
  const dStd = Math.max(1000, Math.round(Number(d.hourPrice) || 0));
  const dVip = Math.max(1000, Math.round(Number(d.vipHourPrice) || 0));
  const dPs5 = Math.max(1000, Math.round(Number(d.ps5HourPrice) || 0));
  const dVr = Math.max(1000, Math.round(Number(d.vrHourPrice) || 0));
  if (d.subPaid !== (c.subPaid !== false)) return true;
  if (d.suspended !== !!c.suspended) return true;
  if (d.hidden !== !!c.hidden) return true;
  if (dStd !== curStd || dVip !== curVip || dPs5 !== curPs5 || dVr !== curVr) return true;
  if (JSON.stringify(d.adminIds) !== JSON.stringify(origAdmins)) return true;
  if (String(S.settingsAdminInput || "").trim().length > 0) return true;
  return false;
}

function getClubSettingsChangesSummary() {
  const changes = [];
  if (S.settingsClubId === null || !S.settingsDraft) return changes;
  const c = C(S.settingsClubId);
  if (!c) return changes;
  const d = S.settingsDraft;
  const origAdmins = normalizeAdminIds(c.adminIds, String(2000 + Number(c.id)));
  const curStd = Number(c.hourPrice) || Math.round(minHour(c));
  const curVip = Number(c.vipHourPrice) || Math.round(curStd * 1.5);
  const curPs5 = Number(c.ps5HourPrice) || Math.round(curStd * 1.4);
  const curVr = Number(c.vrHourPrice) || Math.round(curStd * 1.8);
  if (d.subPaid !== (c.subPaid !== false) || d.suspended !== !!c.suspended || d.hidden !== !!c.hidden) {
    changes.push(t("unsavedChangeAccess"));
  }
  if (JSON.stringify(d.adminIds) !== JSON.stringify(origAdmins) || String(S.settingsAdminInput || "").trim().length > 0) {
    changes.push(t("unsavedChangeAdmins"));
  }
  if (
    Math.max(1000, Math.round(Number(d.hourPrice) || 0)) !== curStd ||
    Math.max(1000, Math.round(Number(d.vipHourPrice) || 0)) !== curVip ||
    Math.max(1000, Math.round(Number(d.ps5HourPrice) || 0)) !== curPs5 ||
    Math.max(1000, Math.round(Number(d.vrHourPrice) || 0)) !== curVr
  ) {
    changes.push(t("unsavedChangePrices"));
  }
  return changes;
}

  const viewFn = views[S.view] || home;
  const v = S.role === "admin" ? adminView() : S.role === "sys" ? sysView() : viewFn();

  rootEl.innerHTML = head() + v + playerBottomNav() + sysBottomNav() + clubInfoModal() + receiptModal() + clubSettingsModal() + clubSettingsConfirmModal() + themeDrawerModal() + (S.toast ? `<div class="toast-msg">${escHtml(S.toast)}</div>` : "");

function detectAuthRole(switchActiveRole = true) {
  const tgUser = getTelegramUser();
  if (tgUser && tgUser.id) {
    const numId = Number(tgUser.id);
    const strId = String(tgUser.id);

    if (SUPER_ADMIN_IDS.has(numId)) {
      S.authRole = "sys";
      if (switchActiveRole) S.role = "sys";
      return;
    }
    const matchedClub = findClubByAdminTgId(strId);
    if (matchedClub) {
      S.authRole = "admin";
      S.adminClubId = matchedClub.id;
      if (switchActiveRole) S.role = "admin";
      return;
    }
    if (CLUB_ADMIN_REGISTRY[strId]) {
      S.authRole = "admin";
      S.adminClubId = Number(CLUB_ADMIN_REGISTRY[strId]) || 1;
      if (switchActiveRole) S.role = "admin";
      return;
    }
  }
  if (S.authRole !== "sys") {
    S.authRole = "user";
    if (switchActiveRole || S.role === "admin") S.role = "user";
  }
}

function applyPersonaRoleFromClubAdmins(_p, switchActiveRole = false) {

function toPay() {
  const c = C(S.club);
  if (!c) return go("home");
  const seatTars = getTariffsForSeat(c, S.seat);
  if (S.tar === null || !seatTars[S.tar]) { S.err = t("pick"); haptic("warning"); return render(); }
  const h = seatTars[S.tar][0];
  if (isPastSlot(S.day, S.start)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(c.id, S.day, S.start, h)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, h)) { S.err = t("conflict"); haptic("warning"); return render(); }
  S.shot = "";
  go("pay");
}

async function submitPay() {
  if (!S.shot) { S.err = t("needShot"); haptic("warning"); return render(); }
  const c = C(S.club);
  const seatTars = c ? getTariffsForSeat(c, S.seat) : null;
  if (!c || S.tar === null || !seatTars || !seatTars[S.tar]) return go("home");
  const x = seatTars[S.tar];

  // Повторная проверка перед записью (защита от двойного бронирования)
  if (isPastSlot(S.day, S.start)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(c.id, S.day, S.start, x[0])) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, x[0])) { S.err = t("conflict"); haptic("warning"); return render(); }

  const newItem = {
    id: newBookingId(),
    club: c.id,
    seat: S.seat,
    day: S.day,
    start: S.start,
    hours: x[0],
    price: x[1],
    st: "new",
    by: "user",
    ownerId: getClientUserId(),
    shot: S.shot,
    created: Date.now()
  };

  if (serverOnline) {
    const res = await apiPost("/api/bookings/create", newItem);
    if (!res.data.ok) {
      S.err = res.data.error || "Ошибка сервера";
      haptic("warning");
      return render();
    }
  } else {
    bk.push(newItem);
    saveBookingCloud(newItem);
  }

  haptic("success");
  S.view = "home";
  S.err = "";
  showToast(t("sent"));
}

async function decide(id, st) {
  const item = bk.find(b => String(b.id) === String(id));

  if (serverOnline) {
    const res = await apiPost("/api/bookings/decide", { id: item.id, st, club: item.club });
    if (!res.data.ok) {
      showToast("⛔ " + (res.data.error || "Доступ запрещён"));
      haptic("warning");
      return;
    }
  } else {
    item.st = st;
    saveBookingCloud(item);
  }
  haptic("success");
  render();
}

  if (S.settingsClubId === null || !S.settingsDraft) return;
  const dirty = isClubSettingsDirty();
  const adminsCount = S.settingsDraft.adminIds.length;
  const pending = String(S.settingsAdminInput || "").trim();
  const pendingValid = /^\d{1,20}$/.test(pending) && !S.settingsDraft.adminIds.includes(pending) && adminsCount < MAX_CLUB_ADMINS;
  const adminsValid = (adminsCount >= 1 && adminsCount <= MAX_CLUB_ADMINS) || (adminsCount === 0 && pendingValid);
  const badgeEl = $("club_settings_dirty_badge");
  if (badgeEl) {
    badgeEl.innerHTML = dirty
      ? `<span class="dirty-pill">● ${t("clubSettingsDirty")}</span>`
      : `<span class="clean-pill">✓ ${t("clubSettingsClean")}</span>`;
  }
  const saveBtn = $("club_settings_save_btn");
  if (saveBtn) {
    saveBtn.className = "cta-btn " + (dirty && adminsValid ? "ok" : (!dirty ? "btn-muted" : "btn-danger-soft"));

}

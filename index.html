  const num = Number(rawVal);
  S.settingsDraft[field] = Number.isFinite(num) ? num : 0;
  const lblEl = $(`cs_price_lbl_${field}`);
  if (lblEl) {
    lblEl.textContent = `${fm(Math.max(1000, Math.round(S.settingsDraft[field] || 0)))} ${t("per")}`;
  }
  updateClubSettingsDirtyDOM();
}

function stepDraftHourPrice(field, delta) {
  if (!S.settingsDraft) return;
  const cur = Number(S.settingsDraft[field]) || 10000;
  S.settingsDraft[field] = Math.max(1000, cur + delta);
  haptic();
  render();
}

function onDraftAdminInput(val) {
  S.settingsAdminInput = String(val ?? "");
  if (S.settingsAdminErr) {
    S.settingsAdminErr = "";
    const errEl = $("cs_admin_err_box");
    if (errEl) errEl.style.display = "none";
  }
  updateClubSettingsDirtyDOM();
}

function addDraftAdminId() {
  if (!S.settingsDraft) return;
  const raw = String(S.settingsAdminInput || "").trim();
  if (!/^\d{1,20}$/.test(raw)) {
    S.settingsAdminErr = t("clubAdminsErrFormat");
    haptic("warning");
    render();
    return;
  }
  if (S.settingsDraft.adminIds.length >= MAX_CLUB_ADMINS) {
    S.settingsAdminErr = t("clubAdminsErrMax");
    haptic("warning");
    render();
    return;
  }
  if (S.settingsDraft.adminIds.includes(raw)) {
    S.settingsAdminErr = t("clubAdminsErrDup");
    haptic("warning");
    render();
    return;
  }
  S.settingsDraft.adminIds.push(raw);
  S.settingsAdminInput = "";
  S.settingsAdminErr = "";
  haptic("success");
  render();
}

function removeDraftAdminId(aid) {
  if (!S.settingsDraft) return;
  S.settingsDraft.adminIds = S.settingsDraft.adminIds.filter(x => x !== String(aid));
  S.settingsAdminErr = S.settingsDraft.adminIds.length === 0 ? t("clubAdminsErrMin") : "";
  haptic();
  render();
}

function clearClubSettingsModalState() {
  S.settingsClubId = null;
  S.settingsDraft = null;
  S.settingsAdminInput = "";
  S.settingsAdminErr = "";
  S.settingsConfirmAction = null;
}

function requestCloseClubSettings() {
  if (S.settingsClubId === null) return;
  if (isClubSettingsDirty()) {
    S.settingsConfirmAction = "close";
    haptic("warning");
    render();
    return;
  }
  clearClubSettingsModalState();
  haptic();
  render();
}

function openBlueprintFromSettings() {
  if (S.settingsClubId === null) return;
  if (isClubSettingsDirty()) {
    S.settingsConfirmAction = "blueprint";
    haptic("warning");
    render();
    return;
  }
  const targetId = S.settingsClubId;
  clearClubSettingsModalState();
  openClubBlueprintEditor(targetId);
}

function cancelSettingsConfirm() {
  S.settingsConfirmAction = null;
  haptic();
  render();
}

function confirmDiscardClubSettings() {
  const action = S.settingsConfirmAction;
  const targetId = S.settingsClubId;
  clearClubSettingsModalState();
  haptic("warning");
  if (action === "blueprint" && targetId) {
    openClubBlueprintEditor(targetId);
    return;
  }
  render();
}

async function saveClubSettingsDraft() {
  if (S.settingsClubId === null || !S.settingsDraft) return;
  const c = C(S.settingsClubId);
  if (!c) return;
  const d = S.settingsDraft;

  // Если пользователь ввёл TG ID в поле и сразу нажал «Сохранить» — валидируем и добавляем автоматически
  const pendingAdmin = String(S.settingsAdminInput || "").trim();
  if (pendingAdmin) {
    if (!/^\d{1,20}$/.test(pendingAdmin)) {
      S.settingsAdminErr = t("clubAdminsErrFormat");
      haptic("warning");
      render();
      return;
    }
    if (d.adminIds.includes(pendingAdmin)) {
      S.settingsAdminErr = t("clubAdminsErrDup");
      haptic("warning");
      render();
      return;
    }
    if (d.adminIds.length >= MAX_CLUB_ADMINS) {
      S.settingsAdminErr = t("clubAdminsErrMax");
      haptic("warning");
      render();
      return;
    }
    d.adminIds.push(pendingAdmin);
    S.settingsAdminInput = "";
  }

  if (d.adminIds.length < 1) {
    S.settingsAdminErr = t("clubAdminsErrMin");
    haptic("warning");
    render();
    return;
  }
  if (d.adminIds.length > MAX_CLUB_ADMINS) {
    S.settingsAdminErr = t("clubAdminsErrMax");
    haptic("warning");
    render();
    return;
  }

  if (!isClubSettingsDirty()) {
    clearClubSettingsModalState();
    haptic();
    showToast(t("clubSettingsNoChanges"));
    return;
  }

  c.subPaid = !!d.subPaid;
  c.suspended = !!d.suspended;
  c.hidden = !!d.hidden;
  c.adminIds = normalizeAdminIds(d.adminIds);
  applyClubHourPrice(c, d.hourPrice, d.vipHourPrice, d.ps5HourPrice, d.vrHourPrice);
  saveBlueprintsLocal();
  const ok = await syncClubState(c);
  if (!ok) return;
  applyPersonaRoleFromClubAdmins(S.persona, false);
  clearClubSettingsModalState();
  haptic("success");
  showToast(t("clubSettingsSavedToast"));
}

async function syncCloudNow() {
  try {
    let changed = false;

    const uid = getClientUserId();
    if (uid && !uid.startsWith("guest_")) {
      const rData = await fsGet(COL_ROLES, String(uid));
      if (rData) {
        if (rData.role === "sys" && S.authRole !== "sys") {
          S.authRole = "sys";
          S.role = "sys";
          changed = true;
        } else if (rData.role === "admin" && S.authRole !== "admin" && S.authRole !== "sys") {
          S.authRole = "admin";
          S.adminClubId = Number(rData.clubId) || 1;
          S.role = "admin";
          changed = true;
        }
      }
    }

    const [bkDocs, clubDocs, ratingDocs] = await Promise.all([
      fsList(COL_BOOKINGS),
      fsList(COL_CLUBS),
      fsList(COL_RATINGS)
    ]);

    if (Array.isArray(bkDocs)) {
      fbLive = true;
      if (bkDocs.length === 0 && !seededBookings) {
        seededBookings = true;
        bk.forEach(item => saveBookingCloud(item));
      } else if (bkDocs.length > 0) {
        const remote = bkDocs.map(d => d.data);
        remote.sort((a, b) => (a.created || 0) - (b.created || 0) || String(a.id).localeCompare(String(b.id)));
        bk = remote;
      }
    }

    if (Array.isArray(clubDocs)) {
      if (clubDocs.length === 0 && !seededClubs) {
        seededClubs = true;
        clubs.forEach(c => saveClubCloud(c));
      } else {
        clubDocs.forEach(d => {
          const data = d.data;
          const target = C(data.id);
          if (target) {
            target.ok = !!data.ok;
            target.gone = !!data.gone;
            if (typeof data.subPaid === "boolean") target.subPaid = data.subPaid;
            if (typeof data.suspended === "boolean") target.suspended = data.suspended;
            if (typeof data.hidden === "boolean") target.hidden = data.hidden;
            if (typeof data.adminIdsJson === "string" && data.adminIdsJson.startsWith("[")) {
              try {
                const parsedIds = JSON.parse(data.adminIdsJson);
                if (Array.isArray(parsedIds) && parsedIds.length) {
                  target.adminIds = normalizeAdminIds(parsedIds, String(2000 + Number(target.id)));
                }
              } catch (e) {}
            }
            if (Number(data.hourPrice) > 0 || Number(data.vipHourPrice) > 0 || Number(data.ps5HourPrice) > 0 || Number(data.vrHourPrice) > 0) {
              applyClubHourPrice(
                target,
                Number(data.hourPrice) || target.hourPrice,
                Number(data.vipHourPrice) || target.vipHourPrice,
                Number(data.ps5HourPrice) || target.ps5HourPrice,
                Number(data.vrHourPrice) || target.vrHourPrice
              );
            }
            if (typeof data.floorMapJson === "string" && data.floorMapJson.startsWith("{")) {
              try {
                const parsedMap = JSON.parse(data.floorMapJson);
                if (parsedMap && parsedMap.size && parsedMap.cells) {
                  target.floorMap = parsedMap;
                }
              } catch (e) {}
            }
          }
        });
        const prevAuth = S.authRole;
        const prevClub = S.adminClubId;
        detectAuthRole(false);
        if (S.authRole !== prevAuth || S.adminClubId !== prevClub) changed = true;
      }
    }

    if (Array.isArray(ratingDocs) && ratingDocs.length > 0) {
      const merged = { ...clubRatings };
      ratingDocs.forEach(d => {
        const r = d.data;
        if (r && r.clubId && r.uid && r.stars) {
          merged[d._id] = r;
        }
      });
      clubRatings = merged;
      try {
        localStorage.setItem("nova_ratings_v1", JSON.stringify(clubRatings));
      } catch (e) {}
    }

    const newSig = JSON.stringify({
      r: S.authRole,
      ac: S.adminClubId,
      b: bk.map(x => [x.id, x.st, x.seat, x.club, x.day, x.start, x.hours]),
      c: clubs.map(x => [x.id, x.ok, x.gone, x.subPaid, x.suspended, x.hidden, x.hourPrice, x.vipHourPrice, x.ps5HourPrice, x.vrHourPrice, x.adminIds]),
      rt: Object.keys(clubRatings).length
    });

    if (newSig !== lastCloudSig || changed) {
      lastCloudSig = newSig;
      safeRenderPreserveModalFocus();
    }
  } catch (e) {}
}

function initFirebase() {
  syncCloudNow();
  setInterval(syncCloudNow, 5000);
}

setInterval(() => {
  const now = Date.now();
  let ch = false;
  bk.forEach(b => {
    if (b.st === "new" && b.created && b.created + 3e5 <= now) {
      b.st = "exp";
      ch = true;
      if (S.role === "admin" || String(b.ownerId || "") === String(getClientUserId())) {
        saveBookingCloud(b);
      }
    }
  });
  if (ch && (S.role !== "user" || S.view === "home")) return safeRenderPreserveModalFocus();
  document.querySelectorAll("[data-exp]").forEach(e => {
    const r = Math.max(0, +e.dataset.exp - now);
    e.textContent = String(Math.floor(r / 6e4)).padStart(2, "0") + ":" + String(Math.floor(r / 1e3) % 60).padStart(2, "0");
  });
}, 1000);

detectAuthRole(true);
render();
initFirebase();
</script>

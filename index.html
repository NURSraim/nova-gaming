<title>Nova Gaming — Cyber Lounge & PC Booking</title>

<style>
:root {
  --bg: #0b0914;
  --bg-gradient: radial-gradient(circle at 50% 0%, #1f1442 0%, #0b0914 70%);
  --surface: rgba(26, 21, 48, 0.7);
  --surface-hover: rgba(38, 30, 71, 0.85);
  --surface-card: rgba(22, 17, 43, 0.75);
  --border: rgba(140, 120, 240, 0.15);
  --border-focus: rgba(0, 240, 255, 0.5);
  
  --text: #f5f3ff;
  --text-muted: #948db8;
  --text-dim: #625b85;
  
  --neon-cyan: #00f0ff;
  --neon-purple: #8b5cf6;
  --neon-green: #00ffa3;
  --neon-red: #ff3366;
  --neon-gold: #ffb703;
  
  --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #00f0ff 100%);
  --accent-glow: 0 0 25px rgba(139, 92, 246, 0.4);
  --green-glow: 0 0 15px rgba(0, 255, 163, 0.3);
  --gold-glow: 0 0 18px rgba(255, 183, 3, 0.4);
  
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

#app {
  max-width: 460px;
  margin: 0 auto;
  padding: 14px 16px 30px;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.03); }
}

.anim-fade {
  animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Top Role Switcher Bar */
.top-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.role-seg {
  display: flex;
  flex: 1;
  background: rgba(18, 14, 34, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 4px;
}

.role-btn {
  flex: 1;
  background: none;
  border: 0;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}

.role-btn.active {
  background: var(--accent-grad);
  color: #fff;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
  font-weight: 700;
}

.lang-btn {
  background: rgba(18, 14, 34, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  color: var(--neon-cyan);
  font-weight: 700;
  font-size: 12px;
  border-radius: var(--radius-md);
  padding: 9px 13px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.lang-btn:active {
  transform: scale(0.94);
}

/* Header & Brand */
.brand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.brand-badge {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

.brand-logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent-grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  box-shadow: var(--accent-glow);
}

.demo-banner {
  background: rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.2);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 18px;
}

.demo-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
}

/* Titles */
h2.section-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Club Cards */
.club-card {
  background: var(--surface-card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
  text-align: left;
  display: block;
  width: 100%;
}

.club-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent-grad);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.club-card:active {
  transform: scale(0.98);
  border-color: rgba(139, 92, 246, 0.4);
}

.club-card:hover::before {
  opacity: 1;
}

.club-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.club-name {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
}

.club-addr {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 12px;
}

.club-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.badge-green {
  background: rgba(0, 255, 163, 0.12);
  color: var(--neon-green);
  border: 1px solid rgba(0, 255, 163, 0.25);
}

.badge-purple {
  background: rgba(139, 92, 246, 0.15);
  color: #c4b5fd;
  border: 1px solid rgba(139, 92, 246, 0.3);
}

.badge-price {
  background: rgba(0, 240, 255, 0.12);
  color: var(--neon-cyan);
  border: 1px solid rgba(0, 240, 255, 0.25);
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
}

/* Back Button */
.back-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 7px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: all 0.2s ease;
}

.back-btn:active {
  transform: scale(0.95);
  color: #fff;
}

/* Legend */
.legend-bar {
  display: flex;
  gap: 16px;
  background: rgba(18, 14, 34, 0.6);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  margin: 12px 0 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-box {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}

/* Cinema Style Seat Grid */
.grid-main {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}

.grid-vip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.seat-btn {
  aspect-ratio: 1;
  background: rgba(26, 21, 48, 0.6);
  border: 2px solid var(--neon-green);
  border-radius: 12px;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.seat-btn::after {
  content: 'ПК';
  font-size: 9px;
  color: var(--neon-green);
  font-weight: 500;
  margin-top: 2px;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

.seat-btn:active {
  transform: scale(0.9);
}

.seat-btn.vip {
  border-color: var(--neon-gold);
  background: rgba(255, 183, 3, 0.08);
}

.seat-btn.vip::after {
  content: 'VIP';
  color: var(--neon-gold);
}

.seat-btn.busy {
  border-color: rgba(255, 51, 102, 0.4);
  background: rgba(255, 51, 102, 0.08);
  color: var(--text-dim);
  cursor: not-allowed;
  opacity: 0.6;
}

.seat-btn.busy::after {
  content: 'ЗАНЯТ';
  color: var(--neon-red);
}

/* Chips / Day Selector */
.chip-group {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.chip-btn {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: var(--radius-md);
  padding: 11px 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}

.chip-btn.active {
  background: var(--accent-grad);
  color: #fff;
  border-color: transparent;
  box-shadow: var(--accent-glow);
  font-weight: 700;
}

/* Custom Select */
.styled-select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: #fff;
  padding: 13px 14px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  outline: none;
  cursor: pointer;
}

.styled-select:focus {
  border-color: var(--neon-cyan);
}

/* Tariffs */
.tariff-card {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text);
}

.tariff-card.active {
  border-color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.08);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
}

.tariff-card b {
  font-family: 'JetBrains Mono', monospace;
  color: var(--neon-cyan);
  font-size: 16px;
}

/* Primary CTA Button */
.cta-btn {
  width: 100%;
  background: var(--accent-grad);
  border: 0;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.2px;
  padding: 16px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  margin-top: 14px;
  box-shadow: var(--accent-glow);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.cta-btn:active {
  transform: scale(0.97);
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
}

.cta-btn.ok {
  background: linear-gradient(135deg, #00ffa3 0%, #00b4d8 100%);
  color: #05261e;
  box-shadow: var(--green-glow);
}

.cta-btn.no {
  background: rgba(255, 51, 102, 0.15);
  border: 1px solid rgba(255, 51, 102, 0.3);
  color: var(--neon-red);
}

/* Payment Screen */
.card-box {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 18px;
  margin-bottom: 12px;
}

.card-number-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  margin: 10px 0;
  background: rgba(0, 0, 0, 0.35);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px dashed rgba(0, 240, 255, 0.3);
  text-align: center;
}

.file-upload-zone {
  display: block;
  border: 2px dashed var(--border);
  background: rgba(26, 21, 48, 0.35);
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  margin-top: 14px;
  transition: all 0.2s ease;
}

.file-upload-zone:hover {
  border-color: var(--neon-purple);
  color: #fff;
}

/* Toast */
.toast-msg {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #00ffa3 0%, #00b4d8 100%);
  color: #05261e;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 14px;
  box-shadow: 0 8px 24px rgba(0, 255, 163, 0.4);
  z-index: 999;
  animation: fadeIn 0.3s ease;
}

.error-text {
  color: var(--neon-red);
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  margin-top: 8px;
}
.st-new { background: rgba(255, 183, 3, 0.15); color: var(--neon-gold); border: 1px solid rgba(255, 183, 3, 0.3); }
.st-ok { background: rgba(0, 255, 163, 0.15); color: var(--neon-green); border: 1px solid rgba(0, 255, 163, 0.3); }
.st-no { background: rgba(255, 51, 102, 0.15); color: var(--neon-red); border: 1px solid rgba(255, 51, 102, 0.3); }

.row-btns {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.row-btns .cta-btn {
  margin-top: 0;
}
</style>

  { id: 1, club: 1, seat: "3", day: 0, start: 14, hours: 3, st: "ok", by: "user" },
  { id: 2, club: 1, seat: "7", day: 0, start: 18, hours: 2, st: "ok", by: "user" },
  { id: 3, club: 1, seat: "V2", day: 0, start: 20, hours: 5, st: "ok", by: "user" },
  { id: 4, club: 2, seat: "5", day: 0, start: 16, hours: 2, st: "ok", by: "user" }
];

let nid = 10;
let S = { role: "user", lang: "ru", view: "home", club: null, seat: null, day: 0, start: null, tar: null, tab: "new", err: "", shot: "", toast: "" };

const t = k => L[S.lang][k];
const $ = id => document.getElementById(id);
const fm = n => n.toLocaleString("ru-RU").replace(/\u00a0/g, " ") + " " + t("sum");
const hh = h => String(h % 24).padStart(2, "0") + ":00";
const C = id => clubs.find(c => c.id === id);
const rng = b => t("days")[b.day] + " " + hh(b.start) + "–" + hh(b.start + b.hours);
const abs = (d, s) => d * 24 + s;

function clash(c, seat, d, s, h) {
  const a = abs(d, s), e = a + h;
  return bk.some(b => b.club === c && b.seat === seat && (b.st === "ok" || b.st === "new") && a < abs(b.day, b.start) + b.hours && abs(b.day, b.start) < e);
}

function closedAt(c, d, s, h) {
  const k = C(c);
  return !(k.open === 0 && k.close === 24) && (s < k.open || s + h > k.close);
}

function minHour(c) {
  return Math.min(...c.tar.map(x => x[1] / x[0]));
}

function tagHtml(b) {
  const cls = b.st === "new" ? "st-new" : b.st === "ok" ? "st-ok" : "st-no";
  const txt = { new: t("sNew"), ok: t("sOk"), no: t("sNo"), exp: t("sExp") }[b.st];
  return `<span class="status-tag ${cls}">${txt}</span>`;
}

function cdHtml(b) {
  return b.st === "new" ? ` <span style="font-family:'JetBrains Mono',monospace;color:var(--neon-gold);font-size:12px;" data-exp="${b.created + 3e5}"></span>` : "";
}

function head() {
  const r = ["user", "admin", "sys"].map(x => `
    <button class="role-btn ${S.role === x ? 'active' : ''}" onclick="setRole('${x}')">
      ${t(x)}
    </button>
  `).join("");

  return `
    <div class="top-bar">
      <div class="role-seg">${r}</div>
      <button class="lang-btn" onclick="setLang()">${S.lang === "ru" ? "🇺🇿 UZ" : "🇷🇺 RU"}</button>
    </div>
    <div class="demo-banner">
      <div class="demo-dot"></div>
      <span>${t("demo")}</span>
    </div>
  `;
}

function home() {
  const list = clubs.filter(c => c.ok).map(c => `
    <div class="club-card anim-fade" onclick="openClub(${c.id})">
      <div class="club-head">
        <div>
          <div class="club-name">${c.name}</div>
          <div class="club-addr">📍 ${c.addr}</div>
        </div>
        <span class="badge badge-price">${t("from")} ${fm(Math.round(minHour(c)))} ${t("per")}</span>
      </div>
      <div class="club-tags">
        <span class="badge badge-green">⚡ ${c.open === 0 && c.close === 24 ? "24/7 Круглосуточно" : hh(c.open) + "–" + hh(c.close)}</span>
        <span class="badge badge-purple">🎮 ${c.gpu}</span>
      </div>
    </div>
  `).join("");

  const my = bk.filter(b => b.by === "user" && b.mine).map(b => `
    <div class="card-box anim-fade">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${C(b.club).name} · ПК ${b.seat}</b>
        <b style="color:var(--neon-cyan);font-family:'JetBrains Mono';">${fm(b.price)}</b>
      </div>
      <p style="color:var(--text-muted);font-size:13px;margin:4px 0;">📅 ${rng(b)}</p>
      ${tagHtml(b)}${cdHtml(b)}
    </div>
  `).join("");

  return `
    <div class="brand-header">
      <div class="brand-title">
        <div class="brand-logo-icon">🎮</div>
        <span class="brand-badge">${t("brand")}</span>
      </div>
    </div>
    <h2 class="section-title">🏛️ ${t("clubs")}</h2>
    ${list}
    ${my ? `<h2 class="section-title">🎟️ ${t("mine")}</h2>${my}` : ""}
  `;
}

function seatBtn(id, isVip) {
  const c = S.club;
  const isBusy = clash(c, id, 0, new Date().getHours(), 1);
  return `
    <button class="seat-btn ${isVip ? 'vip' : ''} ${isBusy ? 'busy' : ''}" onclick="openSeat('${id}')">
      ${id}
    </button>
  `;
}

function clubView() {
  const c = C(S.club);
  return `
    <div class="anim-fade">
      <button class="back-btn" onclick="go('home')">${t("back")}</button>
      <h1 style="font-size:24px;font-weight:800;margin-bottom:4px;">${c.name}</h1>
      <p style="color:var(--text-muted);font-size:13px;">🎮 ${c.gpu} · 📍 ${c.addr}</p>
      
      <div class="legend-bar">
        <div class="legend-item"><div class="legend-box" style="border:2px solid var(--neon-green)"></div> ${t("free")}</div>
        <div class="legend-item"><div class="legend-box" style="border:2px solid var(--neon-red);background:rgba(255,51,102,0.2)"></div> ${t("busy")}</div>
        <div class="legend-item"><div class="legend-box" style="border:2px solid var(--neon-gold)"></div> ${t("vip")}</div>
      </div>

      <h2 class="section-title">🪑 ${t("main")}</h2>
      <div class="grid-main">${MAIN.map(i => seatBtn(i, false)).join("")}</div>

      <h2 class="section-title">👑 ${t("vip")}</h2>
      <div class="grid-vip">${VIP.map(i => seatBtn(i, true)).join("")}</div>
    </div>
  `;
}

function startOpts(cid) {
  const k = C(cid), a = k.open, z = k.close;
  let o = "";
  for (let h = a; h < z; h++) o += `<option value="${h}" ${S.start === h ? "selected" : ""}>🕒 ${hh(h)}</option>`;
  return o;
}

function seatView() {
  const c = C(S.club);
  if (S.start === null) S.start = Math.max(c.open, Math.min(new Date().getHours() + 1, c.close - 1));

  const ex = bk.filter(b => b.club === c.id && b.seat === S.seat && b.st === "ok")
    .map(b => `<p style="color:var(--neon-red);font-size:12px;margin-top:2px;">⚠️ ${t("busyAt")}: ${rng(b)}</p>`).join("");

  const days = t("days").map((d, i) => `
    <button class="chip-btn ${S.day === i ? 'active' : ''}" onclick="S.day=${i};haptic();render()">${d}</button>
  `).join("");

  const tars = c.tar.map((x, i) => `
    <div class="tariff-card ${S.tar === i ? 'active' : ''}" onclick="S.tar=${i};haptic();render()">
      <span>⏱️ <b>${x[0]} ${t("h")}</b> игры</span>
      <b>${fm(x[1])}</b>
    </div>
  `).join("");

  return `
    <div class="anim-fade">
      <button class="back-btn" onclick="go('club')">${t("back")}</button>
      <h1 style="font-size:24px;font-weight:800;">${c.name} · Место #${S.seat}</h1>
      ${ex}

      <h2 class="section-title">📅 Дата бронирования</h2>
      <div class="chip-group">${days}</div>

      <h2 class="section-title">⏰ ${t("start")}</h2>
      <select class="styled-select" onchange="S.start=+this.value;haptic()">${startOpts(c.id)}</select>

      <h2 class="section-title">⚡ ${t("tariff")}</h2>
      ${tars}

      ${S.err ? `<div class="error-text">❌ ${S.err}</div>` : ""}

      <button class="cta-btn" onclick="toPay()">${t("next")}</button>
    </div>
  `;
}

function payView() {
  const c = C(S.club);
  const x = c.tar[S.tar];

  return `
    <div class="anim-fade">
      <button class="back-btn" onclick="go('seat')">${t("back")}</button>
      <h1 style="font-size:24px;font-weight:800;margin-bottom:14px;">💳 ${t("pay")}</h1>

      <div class="card-box">
        <div style="font-size:17px;font-weight:800;">${c.name} · ПК ${S.seat}</div>
        <p style="color:var(--text-muted);font-size:13px;margin:6px 0;">
          📅 ${t("days")[S.day]}, ${hh(S.start)}–${hh(S.start + x[0])} (${x[0]} ${t("h")})
        </p>
        <div style="font-size:22px;font-weight:800;color:var(--neon-green);margin-top:10px;font-family:'JetBrains Mono';">
          ${fm(x[1])}
        </div>
      </div>

      <div class="card-box">
        <p style="color:var(--text-muted);font-size:13px;line-height:1.4;">${t("payInfo")}</p>
        <div class="card-number-display">${c.card}</div>
        <p style="text-align:center;font-size:11px;color:var(--text-dim);">Нажмите и удерживайте, чтобы скопировать номер карты</p>
      </div>

      <label class="file-upload-zone">
        <input type="file" accept="image/*" hidden onchange="$('fn').textContent=this.files[0]?('📎 '+this.files[0].name):'';S.shot=this.files[0]?this.files[0].name:'';haptic();">
        <span id="fn" style="font-weight:600;">${S.shot ? ('📎 ' + S.shot) : t("attach")}</span>
      </label>

      ${S.err ? `<div class="error-text">❌ ${S.err}</div>` : ""}

      <button class="cta-btn ok" onclick="submitPay()">${t("paid")}</button>
    </div>
  `;
}

function adminView() {
  const c = C(1);
  const tabs = [["new", "tNew"], ["ok", "tOk"], ["no", "tNo"]];
  const seg = tabs.map(([k, l]) => `
    <button class="role-btn ${S.tab === k ? 'active' : ''}" onclick="S.tab='${k}';haptic();render()">
      ${t(l)} (${bkTab(k).length})
    </button>
  `).join("");

  const items = bkTab(S.tab).map(b => `
    <div class="card-box anim-fade">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>ПК #${b.seat} · ${rng(b)}</b>
        <b style="color:var(--neon-cyan);">${b.by === "manual" ? t("manualTag") : fm(b.price)}</b>
      </div>
      ${b.by === "user" ? `<p style="font-size:12px;color:var(--neon-green);margin:4px 0;">📎 ${t("shot")}</p>` : ""}
      ${tagHtml(b)}${cdHtml(b)}
      ${b.st === "new" ? `
        <div class="row-btns">
          <button class="cta-btn ok" style="padding:10px;" onclick="decide(${b.id},'ok')">${t("yes")}</button>
          <button class="cta-btn no" style="padding:10px;" onclick="decide(${b.id},'no')">${t("no")}</button>
        </div>
      ` : ""}
    </div>
  `).join("") || `<p style="color:var(--text-muted);text-align:center;padding:24px 0;">${t("empty")}</p>`;

  const seats = [...MAIN, ...VIP].map(s => `<option value="${s}">ПК #${s}</option>`).join("");
  const hrs = [1, 2, 3, 4, 5].map(n => `<option value="${n}">${n} ч.</option>`).join("");

  return `
    <div class="anim-fade">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:12px;">💻 Панель клуба: ${c.name}</h1>
      <div class="role-seg" style="margin-bottom:16px;">${seg}</div>
      ${items}

      <h2 class="section-title">⚡ ${t("manual")}</h2>
      <div class="card-box">
        <div style="display:flex;gap:8px;">
          <select id="ms" class="styled-select">${seats}</select>
          <select id="md" class="styled-select">${t("days").map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
        </div>
        <div style="display:flex;gap:8px;">
          <select id="mh" class="styled-select">${[...Array(24)].map((_, h) => `<option value="${h}">${hh(h)}</option>`).join("")}</select>
          <select id="mn" class="styled-select">${hrs}</select>
        </div>
        ${S.err ? `<div class="error-text">❌ ${S.err}</div>` : ""}
        <button class="cta-btn" onclick="manual()">${t("occ")}</button>
      </div>
    </div>
  `;
}

function bkTab(k) {
  return bk.filter(b => b.club === 1 && (k === "no" ? (b.st === "no" || b.st === "exp") : b.st === k));
}

function sysView() {
  const pend = clubs.filter(c => !c.ok && !c.gone).map(c => `
    <div class="card-box anim-fade">
      <b>${c.name}</b>
      <p style="color:var(--text-muted);font-size:13px;margin:4px 0;">📍 ${c.addr}</p>
      <p style="font-size:13px;color:var(--neon-cyan);">💳 ${t("card")}: ${c.card}</p>
      <div class="row-btns">
        <button class="cta-btn ok" style="padding:10px;" onclick="clubAction(${c.id},true)">${t("appr")}</button>
        <button class="cta-btn no" style="padding:10px;" onclick="clubAction(${c.id},false)">${t("no")}</button>
      </div>
    </div>
  `).join("") || `<p style="color:var(--text-muted);text-align:center;padding:16px 0;">${t("empty")}</p>`;

  const act = clubs.filter(c => c.ok).map(c => `
    <div class="card-box anim-fade" style="margin-bottom:8px;">
      <b>${c.name}</b>
      <p style="color:var(--text-muted);font-size:12px;">📍 ${c.addr} · 🟢 Активен в каталоге</p>
    </div>
  `).join("");

  return `
    <div class="anim-fade">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:12px;">👑 Главный администратор Nova</h1>
      <h2 class="section-title">📥 ${t("reg")}</h2>
      ${pend}
      <h2 class="section-title">✅ ${t("act")}</h2>
      ${act}
    </div>
  `;
}

function render() {
  let v = S.role === "admin" ? adminView() : S.role === "sys" ? sysView() : ({ home, club: clubView, seat: seatView, pay: payView })[S.view]();
  $("app").innerHTML = head() + v + (S.toast ? `<div class="toast-msg">${S.toast}</div>` : "");
}

function setRole(r) { S.role = r; S.err = ""; haptic(); render(); }
function setLang() { S.lang = S.lang === "ru" ? "uz" : "ru"; haptic(); render(); }
function go(v) { S.view = v; S.err = ""; haptic(); render(); }
function openClub(id) { S.club = id; go("club"); }
function openSeat(s) { S.seat = s; S.start = null; S.tar = null; S.day = 0; go("seat"); }

function toPay() {
  const c = C(S.club);
  if (S.tar === null) { S.err = t("pick"); haptic("warning"); return render(); }
  const h = c.tar[S.tar][0];
  if (closedAt(c.id, S.day, S.start, h)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, h)) { S.err = t("conflict"); haptic("warning"); return render(); }
  S.shot = "";
  go("pay");
}

function submitPay() {
  if (!S.shot) { S.err = t("needShot"); haptic("warning"); return render(); }
  const c = C(S.club), x = c.tar[S.tar];
  bk.push({
    id: nid++,
    club: c.id,
    seat: S.seat,
    day: S.day,
    start: S.start,
    hours: x[0],
    price: x[1],
    st: "new",
    by: "user",
    mine: true,
    created: Date.now()
  });
  haptic("success");
  S.toast = t("sent");
  S.view = "home";
  S.err = "";
  render();
  setTimeout(() => { S.toast = ""; render(); }, 3000);
}

function decide(id, st) {
  bk.find(b => b.id === id).st = st;
  haptic("success");
  render();
}

function manual() {
  const s = $("ms").value, d = +$("md").value, h = +$("mh").value, n = +$("mn").value;
  if (closedAt(1, d, h, n)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(1, s, d, h, n)) { S.err = t("conflict"); haptic("warning"); return render(); }
  bk.push({ id: nid++, club: 1, seat: s, day: d, start: h, hours: n, st: "ok", by: "manual" });
  S.err = "";
  S.tab = "ok";
  haptic("success");
  render();
}

function clubAction(id, ok) {
  const c = C(id);
  if (ok) c.ok = true; else c.gone = true;
  haptic("success");
  render();
}

setInterval(() => {
  const now = Date.now();
  let ch = false;
  bk.forEach(b => {
    if (b.st === "new" && b.created + 3e5 <= now) {
      b.st = "exp";
      ch = true;
    }
  });
  if (ch && (S.role !== "user" || S.view === "home")) return render();
  document.querySelectorAll("[data-exp]").forEach(e => {
    const r = Math.max(0, +e.dataset.exp - now);
    e.textContent = String(Math.floor(r / 6e4)).padStart(2, "0") + ":" + String(Math.floor(r / 1e3) % 60).padStart(2, "0");
  });
}, 1000);

render();
</script>
</body>
</html>

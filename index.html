<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NOVA // TACTICAL CYBER BOOKING</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-obsidian: #0b0c10;
  --bg-carbon: #12141b;
  --bg-panel: #171a24;
  --paper: #f2ede2;
  --paper-dim: #dfd9cc;
  --crimson: #ff2442;
  --crimson-dark: #b81229;
  --cyan: #00f0ff;
  --lime: #00ff9d;
  --amber: #ffb800;
  --text-light: #f5f3ef;
  --text-muted: #8e93a6;
  --text-dark: #0b0c10;
  --border-tech: rgba(242, 237, 226, 0.14);
  --border-strong: rgba(242, 237, 226, 0.32);
  --font-display: 'Oswald', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background-color: var(--bg-obsidian);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(255, 36, 66, 0.12) 0%, transparent 55%),
    linear-gradient(rgba(242, 237, 226, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(242, 237, 226, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px, 24px 24px;
  background-attachment: fixed;
  color: var(--text-light);
  font-family: var(--font-sans);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 92px);
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 12px 14px 28px;
  position: relative;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseLive {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.92); }
}

.anim-in {
  animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* TACTICAL HUD TOP BAR */
.hud-top-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-tech);
  padding-bottom: 6px;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.hud-coords {
  display: flex;
  align-items: center;
  gap: 6px;
}

.live-dot {
  width: 6px;
  height: 6px;
  background: var(--lime);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--lime);
  animation: pulseLive 1.8s infinite;
}

.top-bar {
  display: flex;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 12px;
}

.role-seg {
  display: flex;
  flex: 1;
  background: var(--bg-carbon);
  border: 1px solid var(--border-tech);
  padding: 3px;
  gap: 3px;
}

.role-btn {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 8px 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.role-btn.active {
  background: var(--crimson);
  color: #fff;
  box-shadow: 0 0 14px rgba(255, 36, 66, 0.4);
}

.lang-btn {
  background: var(--paper);
  color: var(--text-dark);
  border: none;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 11px;
  padding: 0 12px;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: transform 0.12s ease;
}

.lang-btn:active {
  transform: scale(0.95);
}

/* POSTER HERO HEADER */
.poster-masthead {
  position: relative;
  background: var(--paper);
  color: var(--text-dark);
  padding: 14px 16px 12px;
  margin-bottom: 16px;
  overflow: hidden;
  border-left: 6px solid var(--crimson);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
}

.poster-masthead::after {
  content: "NOVA // 26";
  position: absolute;
  right: -8px;
  bottom: -18px;
  font-family: var(--font-display);
  font-size: 74px;
  font-weight: 700;
  line-height: 1;
  color: rgba(11, 12, 16, 0.06);
  pointer-events: none;
  letter-spacing: -0.03em;
}

.masthead-kicker {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--crimson);
  text-transform: uppercase;
  margin-bottom: 2px;
}

.masthead-title {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 700;
  line-height: 0.94;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  color: var(--text-dark);
}

.masthead-sub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(11, 12, 16, 0.15);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: #333640;
}

.barcode-strip {
  display: inline-block;
  width: 68px;
  height: 14px;
  background: repeating-linear-gradient(
    90deg,
    #0b0c10 0px,
    #0b0c10 2px,
    transparent 2px,
    transparent 4px,
    #0b0c10 4px,
    #0b0c10 5px,
    transparent 5px,
    transparent 8px,
    #0b0c10 8px,
    #0b0c10 11px,
    transparent 11px,
    transparent 13px
  );
}

.barcode-strip.light {
  background: repeating-linear-gradient(
    90deg,
    #f2ede2 0px,
    #f2ede2 2px,
    transparent 2px,
    transparent 4px,
    #f2ede2 4px,
    #f2ede2 5px,
    transparent 5px,
    transparent 8px,
    #f2ede2 8px,
    #f2ede2 11px,
    transparent 11px,
    transparent 13px
  );
  opacity: 0.75;
}

/* SECTION HEADERS */
.sec-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 18px 0 10px;
  border-bottom: 1px solid var(--border-tech);
  padding-bottom: 5px;
}

.sec-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sec-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--crimson);
  font-weight: 700;
  letter-spacing: 0.08em;
}

/* ARKNIGHTS / R6 DOSSIER CLUB POSTER CARD */
.poster-card {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 6px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: transform 0.16s ease;
}

.poster-card:active {
  transform: scale(0.985);
}

.poster-index-col {
  background: var(--bg-carbon);
  border: 1px solid var(--border-strong);
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-family: var(--font-mono);
  position: relative;
}

.poster-idx-num {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  color: var(--paper);
}

.poster-idx-meta {
  font-size: 9px;
  line-height: 1.35;
  color: var(--text-muted);
  text-transform: uppercase;
  margin: 6px 0;
}

.poster-idx-meta b {
  display: block;
  color: var(--paper);
  font-size: 10px;
}

.poster-idx-status {
  background: var(--crimson);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  text-align: center;
  padding: 3px 2px;
  letter-spacing: 0.06em;
}

.poster-main-col {
  position: relative;
  background: linear-gradient(135deg, #1a1016 0%, #0f1118 65%, #181b26 100%);
  border: 1px solid var(--border-strong);
  padding: 12px 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 142px;
}

.poster-card:nth-child(even) .poster-main-col {
  background: linear-gradient(135deg, #0e1924 0%, #0f1118 65%, #161c28 100%);
}

.poster-card:nth-child(even) .poster-idx-status {
  background: var(--cyan);
  color: #0b0c10;
}

.poster-bg-word {
  position: absolute;
  left: 6px;
  top: -8px;
  font-family: var(--font-display);
  font-size: 86px;
  font-weight: 700;
  line-height: 0.85;
  text-transform: uppercase;
  letter-spacing: -0.04em;
  color: rgba(255, 36, 66, 0.16);
  pointer-events: none;
  z-index: 0;
  white-space: nowrap;
}

.poster-card:nth-child(even) .poster-bg-word {
  color: rgba(0, 240, 255, 0.13);
}

.poster-silhouette {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 118px;
  height: 132px;
  opacity: 0.26;
  pointer-events: none;
  z-index: 0;
}

.poster-top-row {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.poster-club-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--paper);
}

.poster-club-addr {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.poster-price-pill {
  background: var(--paper);
  color: var(--text-dark);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  padding: 4px 8px;
  white-space: nowrap;
  border-left: 3px solid var(--crimson);
}

.poster-bottom-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  padding-top: 8px;
  border-top: 1px dashed rgba(242, 237, 226, 0.18);
  gap: 6px;
  flex-wrap: wrap;
}

.spec-chip {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 7px;
  background: rgba(11, 12, 16, 0.78);
  border: 1px solid var(--border-tech);
  color: var(--paper);
  text-transform: uppercase;
}

.spec-chip.highlight {
  border-color: var(--crimson);
  color: #ff6b81;
}

.spec-chip.live {
  border-color: rgba(0, 255, 157, 0.4);
  color: var(--lime);
}

/* DOSSIER HERO POSTER INSIDE CLUB VIEW */
.club-hero-poster {
  position: relative;
  background: var(--crimson);
  color: var(--paper);
  border: 2px solid var(--paper);
  padding: 14px 14px 12px;
  margin-bottom: 14px;
  overflow: hidden;
}

.club-hero-watermark {
  position: absolute;
  left: -4px;
  top: 12px;
  font-family: var(--font-display);
  font-size: 104px;
  font-weight: 700;
  line-height: 0.8;
  color: rgba(11, 12, 16, 0.18);
  text-transform: uppercase;
  pointer-events: none;
  z-index: 0;
}

.club-hero-header {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  background: var(--bg-obsidian);
  color: var(--paper);
  padding: 4px 8px;
  margin-bottom: 10px;
}

.club-hero-title {
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  line-height: 0.92;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 2px 12px rgba(11, 12, 16, 0.35);
}

.club-hero-loadout {
  position: relative;
  z-index: 1;
  background: var(--paper);
  color: var(--text-dark);
  padding: 8px 10px;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}

/* TACTICAL FILTER / TIME STRIP ON CLUB VIEW */
.tactical-filter-box {
  background: var(--bg-carbon);
  border: 1px solid var(--border-strong);
  padding: 10px 12px;
  margin-bottom: 14px;
}

.filter-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}

.day-pills {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.day-pill {
  flex: 1;
  background: var(--bg-obsidian);
  border: 1px solid var(--border-tech);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 7px 4px;
  cursor: pointer;
  text-transform: uppercase;
}

.day-pill.active {
  background: var(--paper);
  color: var(--text-dark);
  border-color: var(--paper);
}

/* SEAT MATRIX */
.legend-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend-swatch {
  width: 10px;
  height: 10px;
  display: inline-block;
}

.grid-main {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin-bottom: 16px;
}

.grid-vip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}

.seat-btn {
  position: relative;
  background: var(--bg-carbon);
  border: 1px solid rgba(0, 255, 157, 0.35);
  color: var(--paper);
  padding: 8px 4px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  transition: all 0.14s ease;
}

.seat-btn .seat-code {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
}

.seat-btn .seat-state {
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--lime);
  text-transform: uppercase;
}

.seat-btn.vip {
  border-color: rgba(255, 184, 0, 0.55);
  background: linear-gradient(180deg, rgba(255, 184, 0, 0.12) 0%, var(--bg-carbon) 100%);
}

.seat-btn.vip .seat-state {
  color: var(--amber);
}

.seat-btn.busy {
  border-color: rgba(255, 36, 66, 0.45);
  background: rgba(255, 36, 66, 0.12);
  opacity: 0.72;
}

.seat-btn.busy .seat-state {
  color: var(--crimson);
}

.seat-btn.selected {
  background: var(--paper) !important;
  color: var(--text-dark) !important;
  border: 2px solid var(--crimson) !important;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(255, 36, 66, 0.35);
}

.seat-btn.selected .seat-code {
  color: var(--text-dark);
}

.seat-btn.selected .seat-state {
  color: var(--crimson);
}

/* TACTICAL LOADOUT BOOKING PANEL */
.loadout-panel {
  background: var(--paper);
  color: var(--text-dark);
  border-left: 6px solid var(--crimson);
  padding: 14px;
  margin-top: 10px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
}

.loadout-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--text-dark);
  padding-bottom: 8px;
  margin-bottom: 12px;
}

.loadout-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1;
}

.tariff-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin: 10px 0 12px;
}

.tariff-tile {
  background: #e5dfd2;
  border: 2px solid transparent;
  padding: 9px 6px;
  text-align: center;
  cursor: pointer;
  transition: all 0.14s ease;
}

.tariff-tile.active {
  background: var(--bg-obsidian);
  color: var(--paper);
  border-color: var(--crimson);
}

.tariff-hrs {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

.tariff-sum {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  margin-top: 4px;
  color: var(--crimson);
}

.tariff-tile.active .tariff-sum {
  color: var(--lime);
}

/* SELECTS & BUTTONS */
.styled-select {
  width: 100%;
  background: var(--bg-obsidian);
  color: var(--paper);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  padding: 10px 12px;
  margin-bottom: 10px;
  outline: none;
}

.back-btn {
  background: var(--bg-carbon);
  color: var(--paper);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 7px 12px;
  margin-bottom: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.cta-btn {
  width: 100%;
  background: var(--crimson);
  color: #fff;
  border: none;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 13px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  transition: transform 0.12s ease, filter 0.12s ease;
}

.cta-btn:active {
  transform: scale(0.985);
}

.cta-btn.ok {
  background: var(--lime);
  color: var(--text-dark);
}

.cta-btn.no {
  background: #282c3a;
  color: var(--crimson);
  border: 1px solid var(--crimson);
}

/* CARDS & PAYMENT DOSSIER */
.card-box {
  background: var(--bg-carbon);
  border: 1px solid var(--border-strong);
  padding: 14px;
  margin-bottom: 12px;
  position: relative;
}

.card-number-display {
  background: var(--bg-obsidian);
  border: 1px dashed var(--crimson);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 12px;
  margin: 10px 0 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.copy-pill {
  background: var(--crimson);
  color: #fff;
  font-size: 10px;
  padding: 4px 8px;
}

.file-upload-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(242, 237, 226, 0.05);
  border: 2px dashed var(--border-strong);
  padding: 18px 14px;
  margin-bottom: 14px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 12px;
  text-align: center;
}

.status-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 4px 8px;
  margin-top: 6px;
}

.st-new { background: rgba(255, 184, 0, 0.15); color: var(--amber); border: 1px solid var(--amber); }
.st-ok { background: rgba(0, 255, 157, 0.15); color: var(--lime); border: 1px solid var(--lime); }
.st-no { background: rgba(255, 36, 66, 0.15); color: var(--crimson); border: 1px solid var(--crimson); }

.error-text {
  background: rgba(255, 36, 66, 0.16);
  border-left: 4px solid var(--crimson);
  color: #ff8fa0;

const t = k => L[S.lang][k];
const $ = id => document.getElementById(id);
const fm = n => n.toLocaleString("ru-RU").replace(/\u00a0/g, " ") + " " + t("sum");
const hh = h => String(h % 24).padStart(2, "0") + ":00";

const rng = b => t("days")[b.day] + " " + hh(b.start) + "–" + hh(b.start + b.hours);
const abs = (d, s) => d * 24 + s;

function clash(c, seat, d, s, h) {
  const a = abs(d, s), e = a + h;
  return bk.some(b => b.club === c && b.seat === seat && (b.st === "ok" || b.st === "new") && a < abs(b.day, b.start) + b.hours && abs(b.day, b.start) < e);
}

function closedAt(c, d, s, h) {
  const k = C(c);
  return !(k.open === 0 && k.close === 24) && (s < k.open || s + h > k.close);
}

function minHour(c) {
  return Math.min(...c.tar.map(x => x[1] / x[0]));
}

function operatorSvg() {
  return `<svg class="poster-silhouette" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">

    <circle cx="71" cy="43" r="4" fill="#f2ede2"/>
  </svg>`;
}

function tagHtml(b) {
  const cls = b.st === "new" ? "st-new" : b.st === "ok" ? "st-ok" : "st-no";
  const txt = { new: t("sNew"), ok: t("sOk"), no: t("sNo"), exp: t("sExp") }[b.st] || b.st;
  return `<span class="status-tag ${cls}">${txt}</span>`;
}

function cdHtml(b) {
  if (b.st !== "new") return "";
  return ` <span style="font-family:var(--font-mono);color:var(--amber);font-size:12px;font-weight:800;" data-exp="${b.created + 3e5}"></span>`;
}

      <span class="seat-state">${isBusy ? 'BUSY' : (isVip ? 'VIP' : 'FREE')}</span>

  `;
}

  const k = C(cid), a = k.open, z = k.close;

      </div>

      <label class="file-upload-zone">
        <input type="file" accept="image/*" hidden onchange="$('fn').textContent=this.files[0]?('📎 '+this.files[0].name):'';S.shot=this.files[0]?this.files[0].name:'';S.err='';haptic();">
        <span id="fn" style="font-weight:800;color:var(--paper);">${S.shot ? ('📎 ' + S.shot) : t("attach")}</span>
      </label>

      ${S.err ? `<div class="error-text">[ERROR] ${S.err}</div>` : ""}

      <button class="cta-btn ok" onclick="submitPay()">
        <span>${t("paid")}</span>
        <span>✓</span>
      </button>
    </div>
  `;
}

function adminView() {
  const curClub = C(S.adminClubId) || C(1);
  const activeClubs = clubs.filter(c => c.ok);

  const clubSelectOptions = activeClubs.map(c => `
    <option value="${c.id}" ${c.id === curClub.id ? 'selected' : ''}>SECTOR // ${c.name}</option>
  `).join("");

  const tabs = [["new", "tNew"], ["ok", "tOk"], ["no", "tNo"]];
  const seg = tabs.map(([k, l]) => `
    <button class="role-btn ${S.tab === k ? 'active' : ''}" onclick="S.tab='${k}';haptic();render()">
      ${t(l)} (${bkTab(k, curClub.id).length})
    </button>
  `).join("");

  const items = bkTab(S.tab, curClub.id).map(b => `
    <div class="card-box anim-in" style="border-left:4px solid var(--crimson);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-family:var(--font-display);font-size:20px;">UNIT #${b.seat} // ${rng(b)}</b>
        <b style="color:var(--cyan);font-family:var(--font-mono);font-size:12px;">${b.by === "manual" ? t("manualTag") : fm(b.price)}</b>
      </div>
      ${b.by === "user" ? `<p style="font-size:11px;font-family:var(--font-mono);color:var(--lime);margin:6px 0;">📎 ${t("shot")}</p>` : ""}
      ${tagHtml(b)}${cdHtml(b)}
      ${b.st === "new" ? `
        <div class="row-btns">
          <button class="cta-btn ok" style="padding:10px;font-size:16px;" onclick="decide(${b.id},'ok')"><span>${t("yes")}</span></button>
          <button class="cta-btn no" style="padding:10px;font-size:16px;" onclick="decide(${b.id},'no')"><span>${t("no")}</span></button>
        </div>
      ` : ""}
    </div>
  `).join("") || `<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px;text-align:center;padding:24px 0;">${t("empty")}</p>`;

  const seats = [...MAIN, ...VIP].map(s => `<option value="${s}">UNIT #${s}</option>`).join("");
  const hrs = [1, 2, 3, 4, 5].map(n => `<option value="${n}">${n} ${t("h")}</option>`).join("");

  return `
    <div class="anim-in">
      <div class="poster-masthead">
        <div class="masthead-kicker"><span>// OPERATOR CONSOLE</span><span>ADMIN</span></div>
        <div class="masthead-title">УПРАВЛЕНИЕ АРЕНОЙ</div>
      </div>

      <select class="styled-select" onchange="S.adminClubId=+this.value;haptic();render()">
        ${clubSelectOptions}
      </select>

      <div class="role-seg" style="margin-bottom:14px;">${seg}</div>
      ${items}

      <div class="sec-head">
        <span class="sec-title">${t("manual")}</span>
        <span class="sec-tag">// RECEPTION</span>
      </div>
      <div class="card-box">
        <div style="display:flex;gap:8px;">
          <select id="ms" class="styled-select">${seats}</select>
          <select id="md" class="styled-select">${t("days").map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
        </div>
        <div style="display:flex;gap:8px;">
          <select id="mh" class="styled-select">${[...Array(24)].map((_, h) => `<option value="${h}">${hh(h)}</option>`).join("")}</select>
          <select id="mn" class="styled-select">${hrs}</select>
        </div>
        ${S.err ? `<div class="error-text">[ERROR] ${S.err}</div>` : ""}
        <button class="cta-btn" onclick="manual(${curClub.id})"><span>${t("occ")}</span><span>→</span></button>
      </div>
    </div>
  `;
}

function bkTab(k, clubId) {
  return bk.filter(b => b.club === clubId && (k === "no" ? (b.st === "no" || b.st === "exp") : b.st === k));
}

function sysView() {
  const pend = clubs.filter(c => !c.ok && !c.gone).map(c => `
    <div class="card-box anim-in" style="border-left:4px solid var(--amber);">
      <b style="font-family:var(--font-display);font-size:22px;">${c.name}</b>
      <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;margin:4px 0;">📍 ${c.addr} · ${c.gpu}</p>
      <p style="font-size:12px;font-family:var(--font-mono);color:var(--cyan);">💳 ${t("card")}: ${c.card}</p>
      <div class="row-btns">
        <button class="cta-btn ok" style="padding:10px;font-size:16px;" onclick="clubAction(${c.id},true)"><span>${t("appr")}</span></button>
        <button class="cta-btn no" style="padding:10px;font-size:16px;" onclick="clubAction(${c.id},false)"><span>${t("no")}</span></button>
      </div>
    </div>
  `).join("") || `<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px;text-align:center;padding:16px 0;">${t("empty")}</p>`;

  const act = clubs.filter(c => c.ok).map(c => `
    <div class="card-box anim-in" style="margin-bottom:8px;border-left:4px solid var(--lime);">
      <b style="font-family:var(--font-display);font-size:19px;">${c.name}</b>
      <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">📍 ${c.addr} · [ONLINE]</p>
    </div>
  `).join("");

  return `
    <div class="anim-in">
      <div class="poster-masthead">
        <div class="masthead-kicker"><span>// ROOT CLEARANCE</span><span>SYS.ADMIN</span></div>
        <div class="masthead-title">СЕТЬ NOVA GAMING</div>
      </div>
      <div class="sec-head"><span class="sec-title">${t("reg")}</span><span class="sec-tag">// PENDING</span></div>
      ${pend}
      <div class="sec-head"><span class="sec-title">${t("act")}</span><span class="sec-tag">// LIVE</span></div>
      ${act}
    </div>
  `;
}

function render() {
  let v = S.role === "admin" ? adminView() : S.role === "sys" ? sysView() : ({ home, club: clubView, pay: payView })[S.view]();
  $("app").innerHTML = head() + v + (S.toast ? `<div class="toast-msg">${S.toast}</div>` : "");
}

function setRole(r) { S.role = r; S.err = ""; haptic(); render(); }
function setLang() { S.lang = S.lang === "ru" ? "uz" : "ru"; haptic(); render(); }
function go(v) { S.view = v; S.err = ""; haptic(); render(); }
function openClub(id) {
  S.club = id;
  const c = C(id);
  S.start = Math.max(c.open, Math.min(new Date().getHours() + 1, c.close - 1));
  S.tar = 0;
  S.seat = "1";
  go("club");
}
function selectSeat(s) {
  S.seat = s;
  S.err = "";
  haptic();
  render();
}

function copyCard(num) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(num);
  }
  S.copied = true;
  haptic("success");
  render();
  setTimeout(() => { S.copied = false; render(); }, 2000);
}

function toPay() {
  const c = C(S.club);
  if (S.tar === null) { S.err = t("pick"); haptic("warning"); return render(); }
  const h = c.tar[S.tar][0];
  if (closedAt(c.id, S.day, S.start, h)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, h)) { S.err = t("conflict"); haptic("warning"); return render(); }
  S.shot = "";
  go("pay");
}

function submitPay() {
  if (!S.shot) { S.err = t("needShot"); haptic("warning"); return render(); }
  const c = C(S.club), x = c.tar[S.tar];
  bk.push({
    id: nid++,
    club: c.id,
    seat: S.seat,
    day: S.day,
    start: S.start,
    hours: x[0],
    price: x[1],
    st: "new",
    by: "user",
    mine: true,
    created: Date.now()
  });
  S.adminClubId = c.id;
  haptic("success");
  S.toast = t("sent");
  S.view = "home";
  S.err = "";
  render();
  setTimeout(() => { S.toast = ""; render(); }, 3200);
}

function decide(id, st) {
  const item = bk.find(b => b.id === id);
  if (item) item.st = st;
  haptic("success");
  render();
}

function manual(clubId) {
  const s = $("ms").value, d = +$("md").value, h = +$("mh").value, n = +$("mn").value;
  if (closedAt(clubId, d, h, n)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(clubId, s, d, h, n)) { S.err = t("conflict"); haptic("warning"); return render(); }
  bk.push({ id: nid++, club: clubId, seat: s, day: d, start: h, hours: n, st: "ok", by: "manual" });
  S.err = "";
  S.tab = "ok";
  haptic("success");
  render();
}

function clubAction(id, ok) {
  const c = C(id);
  if (ok) c.ok = true; else c.gone = true;
  haptic("success");
  render();
}

setInterval(() => {
  const now = Date.now();
  let ch = false;
  bk.forEach(b => {
    if (b.st === "new" && b.created + 3e5 <= now) {
      b.st = "exp";
      ch = true;
    }
  });
  if (ch && (S.role !== "user" || S.view === "home")) return render();
  document.querySelectorAll("[data-exp]").forEach(e => {
    const r = Math.max(0, +e.dataset.exp - now);
    e.textContent = String(Math.floor(r / 6e4)).padStart(2, "0") + ":" + String(Math.floor(r / 1e3) % 60).padStart(2, "0");
  });
}, 1000);

render();
</script>
</body>
</html>

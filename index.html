function openClubBlueprintEditor(clubId) {
  S.bpClubId = clubId;
  S.bpFocusKey = null;
  S.role = "sys";
  S.sysTab = "map";
  haptic();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function previewClubFromBp(clubId) {
  S.role = "user";
  S.club = clubId;
  S.view = "club";
  haptic();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setBpClub(clubId) {
  S.bpClubId = clubId;
  S.bpFocusKey = null;
  haptic();
  render();
}

function setBpTool(toolKey) {
  S.bpTool = toolKey;
  if (toolKey !== "inspect") S.bpFocusKey = null;
  haptic();
  render();
}

function setBpZoom(val) {
  S.bpZoom = val;
  haptic();
  render();
}

async function setBpSize(newSize) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  if (!c.floorMap) c.floorMap = buildPresetMap(c, "arena");
  c.floorMap.size = newSize;
  // Удаляем клетки, выходящие за пределы новой сетки
  const cleaned = {};
  Object.entries(c.floorMap.cells || {}).forEach(([k, val]) => {
    const [r, col] = k.split("_").map(Number);
    if (r < newSize && col < newSize) cleaned[k] = val;
  });
  c.floorMap.cells = cleaned;
  S.bpFocusKey = null;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  render();
}

async function applyBpPreset(presetKey) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  c.floorMap = buildPresetMap(c, presetKey);
  S.bpFocusKey = null;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  showToast(t("bpSavedToast"));
  render();
}

function nextSeatIdForType(c, type) {
  const cells = Object.values((c && c.floorMap && c.floorMap.cells) || {});
  const prefixMap = { pc: "", vip: "V", ps5: "PS", vr: "VR" };
  const pref = prefixMap[type] ?? "";
  if (type === "wall") return "WALL";
  const used = new Set(cells.filter(x => x && x.type === type).map(x => String(x.id)));
  for (let i = 1; i <= 1024; i++) {
    const candidate = `${pref}${i}`;
    if (!used.has(candidate)) return candidate;
  }
  return `${pref}1`;
}

async function onBpEdgeToggle(edgeKey) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  if (!c.floorMap || !c.floorMap.cells) c.floorMap = buildPresetMap(c, "arena");
  if (!c.floorMap.walls || typeof c.floorMap.walls !== "object") c.floorMap.walls = {};
  if (c.floorMap.walls[edgeKey]) {
    delete c.floorMap.walls[edgeKey];
  } else {
    c.floorMap.walls[edgeKey] = true;
  }
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic();
  render();
}

async function onBpCellClick(key) {
  const c = C(S.bpClubId) || clubs[0];
  if (!c) return;
  if (!c.floorMap || !c.floorMap.cells) c.floorMap = buildPresetMap(c, "arena");
  if (S.bpTool === "wall") return;

  if (S.bpTool === "inspect") {
    if (c.floorMap.cells[key]) {
      S.bpFocusKey = key;
      haptic();
      render();
    }
    return;
  }

  if (S.bpTool === "empty") {
    delete c.floorMap.cells[key];
    if (S.bpFocusKey === key) S.bpFocusKey = null;
  } else {
    const existing = c.floorMap.cells[key];
    if (existing && existing.type === S.bpTool) {
      // Повторный клик тем же инструментом открывает инспектор деталей этого места
      S.bpFocusKey = key;
    } else {
      const newId = nextSeatIdForType(c, S.bpTool);
      c.floorMap.cells[key] = {
        type: S.bpTool,
        id: newId,
        spec: defaultSpecForType(c, S.bpTool)
      };
      S.bpFocusKey = key;
    }
  }
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic();
  render();
}

async function saveBpSeatCustomSpec() {
  const c = C(S.bpClubId) || clubs[0];
  if (!c || !S.bpFocusKey || !c.floorMap || !c.floorMap.cells[S.bpFocusKey]) return;
  const cell = c.floorMap.cells[S.bpFocusKey];
  const idInp = $("bp_seat_id_inp");
  const specInp = $("bp_seat_spec_inp");
  if (idInp && idInp.value.trim()) cell.id = idInp.value.trim();
  if (specInp && specInp.value.trim()) cell.spec = specInp.value.trim();
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  showToast(t("bpSavedToast"));
  render();
}

async function deleteBpFocusedCell() {
  const c = C(S.bpClubId) || clubs[0];
  if (!c || !S.bpFocusKey || !c.floorMap) return;
  delete c.floorMap.cells[S.bpFocusKey];
  S.bpFocusKey = null;
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("warning");
  render();
}

let toastTimer = null;
function showToast(msg) {
  S.toast = msg;
  if (toastTimer) clearTimeout(toastTimer);
  render();
  toastTimer = setTimeout(() => {
    S.toast = "";
    toastTimer = null;
    if (S.settingsClubId !== null) {
      document.querySelectorAll(".toast-msg").forEach(el => el.remove());
    } else {
      render();
    }
  }, 3000);
}

function isClubSettingsDirty() {
  if (S.settingsClubId === null || !S.settingsDraft) return false;
  const c = C(S.settingsClubId);
  if (!c) return false;
  const d = S.settingsDraft;
  const origAdmins = normalizeAdminIds(c.adminIds, String(2000 + Number(c.id)));
  const curStd = Number(c.hourPrice) || Math.round(minHour(c));
  const curVip = Number(c.vipHourPrice) || Math.round(curStd * 1.5);
  const curPs5 = Number(c.ps5HourPrice) || Math.round(curStd * 1.4);
  const curVr = Number(c.vrHourPrice) || Math.round(curStd * 1.8);
  const dStd = Math.max(1000, Math.round(Number(d.hourPrice) || 0));
  const dVip = Math.max(1000, Math.round(Number(d.vipHourPrice) || 0));
  const dPs5 = Math.max(1000, Math.round(Number(d.ps5HourPrice) || 0));
  const dVr = Math.max(1000, Math.round(Number(d.vrHourPrice) || 0));
  if (d.subPaid !== (c.subPaid !== false)) return true;
  if (d.suspended !== !!c.suspended) return true;
  if (d.hidden !== !!c.hidden) return true;
  if (Number(d.open) !== (Number(c.open) || 0) || Number(d.close) !== (Number(c.close) || 24)) return true;
  if (String(d.addr || "").trim() !== String(c.addr || "").trim()) return true;
  if (String(d.landmark || "").trim() !== String(c.landmark || "").trim()) return true;
  if (String(d.locInput || "").trim() !== formatClubLocInputValue(c).trim()) return true;
  if (dStd !== curStd || dVip !== curVip || dPs5 !== curPs5 || dVr !== curVr) return true;
  if (JSON.stringify(d.adminIds) !== JSON.stringify(origAdmins)) return true;
  if (String(S.settingsAdminInput || "").trim().length > 0) return true;
  return false;
}

function getClubSettingsChangesSummary() {
  const changes = [];
  if (S.settingsClubId === null || !S.settingsDraft) return changes;
  const c = C(S.settingsClubId);
  if (!c) return changes;
  const d = S.settingsDraft;
  const origAdmins = normalizeAdminIds(c.adminIds, String(2000 + Number(c.id)));
  const curStd = Number(c.hourPrice) || Math.round(minHour(c));
  const curVip = Number(c.vipHourPrice) || Math.round(curStd * 1.5);
  const curPs5 = Number(c.ps5HourPrice) || Math.round(curStd * 1.4);
  const curVr = Number(c.vrHourPrice) || Math.round(curStd * 1.8);
  if (d.subPaid !== (c.subPaid !== false) || d.suspended !== !!c.suspended || d.hidden !== !!c.hidden) {
    changes.push(t("unsavedChangeAccess"));
  }
  if (Number(d.open) !== (Number(c.open) || 0) || Number(d.close) !== (Number(c.close) || 24)) {
    changes.push(t("unsavedChangeHours"));
  }
  if (String(d.addr || "").trim() !== String(c.addr || "").trim() || String(d.landmark || "").trim() !== String(c.landmark || "").trim() || String(d.locInput || "").trim() !== formatClubLocInputValue(c).trim()) {
    changes.push(t("unsavedChangeLoc"));
  }
  if (JSON.stringify(d.adminIds) !== JSON.stringify(origAdmins) || String(S.settingsAdminInput || "").trim().length > 0) {
    changes.push(t("unsavedChangeAdmins"));
  }
  if (
    Math.max(1000, Math.round(Number(d.hourPrice) || 0)) !== curStd ||
    Math.max(1000, Math.round(Number(d.vipHourPrice) || 0)) !== curVip ||
    Math.max(1000, Math.round(Number(d.ps5HourPrice) || 0)) !== curPs5 ||
    Math.max(1000, Math.round(Number(d.vrHourPrice) || 0)) !== curVr
  ) {
    changes.push(t("unsavedChangePrices"));
  }
  return changes;
}

async function submitCreateClub() {
  const d = S.createClubDraft;
  if (!d) return;
  const pendingAdmin = String(S.createClubAdminInput || "").trim();
  if (pendingAdmin) {
    if (!/^\d{1,20}$/.test(pendingAdmin)) { S.createClubErr = t("clubAdminsErrFormat"); haptic("warning"); return render(); }
    if (!d.adminIds.includes(pendingAdmin) && d.adminIds.length < MAX_CLUB_ADMINS) d.adminIds.push(pendingAdmin);
    S.createClubAdminInput = "";
  }
  if (!String(d.name || "").trim()) { S.createClubErr = t("createClubErrName"); haptic("warning"); return render(); }
  if (!String(d.addr || "").trim()) { S.createClubErr = t("createClubErrAddr"); haptic("warning"); return render(); }
  if (!String(d.card || "").trim()) { S.createClubErr = t("createClubErrCard"); haptic("warning"); return render(); }
  if (d.adminIds.length < 1) { S.createClubErr = t("clubAdminsErrMin"); haptic("warning"); return render(); }

  const nextId = Math.max(100, ...clubs.map(x => Number(x.id) || 0)) + 1;
  const parsedLoc = parseClubLocationInput(d.locInput);
  const newClub = upsertClubFromData({
    id: nextId,
    name: d.name.trim(),
    addr: d.addr.trim(),
    landmark: d.landmark.trim(),
    lat: parsedLoc.lat,
    lng: parsedLoc.lng,
    mapUrl: parsedLoc.mapUrl,
    open: Number.isFinite(Number(d.open)) ? Number(d.open) : 0,
    close: Number.isFinite(Number(d.close)) ? Number(d.close) : 24,
    card: d.card.trim(),
    gpu: d.gpu.trim() || "RTX 4070 · 240Hz",
    contact: { tg: d.tg.trim(), phone: d.phone.trim(), public: Boolean(d.tg.trim() || d.phone.trim()) },
    amenities: d.amenities.slice(),
    subFee: Number(d.subFee) || 200000,
    hourPrice: Math.max(1000, Number(d.hourPrice) || 15000),
    vipHourPrice: Math.max(1000, Number(d.vipHourPrice) || 25000),
    ps5HourPrice: Math.max(1000, Number(d.ps5HourPrice) || 20000),
    vrHourPrice: Math.max(1000, Number(d.vrHourPrice) || 30000),
    adminIds: d.adminIds.slice(),
    preset: d.preset || "arena",
    ok: true,
    gone: false,
    subPaid: true,
    suspended: false,
    hidden: false
  });
  saveBlueprintsLocal();
  await syncClubState(newClub);
  S.createClubDraft = null;
  S.createClubAdminInput = "";
  S.createClubErr = "";
  haptic("success");
  showToast(t("createClubSavedToast"));
}

let lastRenderedScreenKey = "";
function render() {
  const canUseRole = r => r === "user" || r === S.authRole || (S.authRole === "sys" && r === "admin");

    S.role = "user";
  }

  const views = { home, club: clubView, seat: seatView, pay: payView, history: historyView };
  const viewFn = views[S.view] || home;
  const v = S.role === "admin" ? adminView() : S.role === "sys" ? sysView() : viewFn();
  const rootEl = $("app");
  const screenKey = `${S.role}:${S.view}:${S.sysTab}`;
  const sameScreen = screenKey === lastRenderedScreenKey;
  lastRenderedScreenKey = screenKey;
  rootEl.classList.toggle("no-anim", sameScreen);
  rootEl.innerHTML = head() + v + playerBottomNav() + sysBottomNav() + clubInfoModal() + receiptModal() + clubSettingsModal() + clubSettingsConfirmModal() + createClubModal() + themeDrawerModal() + shotPreviewModal() + adminClubSettingsModal() + mapSheetModal() + (S.toast ? `<div class="toast-msg">${escHtml(S.toast)}</div>` : "");
  applyAppleEmojis(rootEl);
  if (prevSettingsScroll > 0) {
    const nextSettingsBody = document.querySelector(".settings-modal-body");
    if (nextSettingsBody) nextSettingsBody.scrollTop = prevSettingsScroll;
  }
}

function onShotPicked(input) {
  const file = input.files && input.files[0];
  const name = file ? file.name : "";
  S.shot = name;
  S.shotImg = "";
  S.err = "";
  haptic();
  if (!file) { render(); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const maxW = 540;
      const scale = img.width > maxW ? (maxW / img.width) : 1;
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement("canvas");
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      S.shotImg = cv.toDataURL("image/jpeg", 0.6);
      render();
    };
    img.onerror = () => { render(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function toPay() {
  const c = C(S.club);
  if (!c) return go("home");
  const seatTars = getTariffsForSeat(c, S.seat);
  if (S.tar === null || !seatTars[S.tar]) { S.err = t("pick"); haptic("warning"); return render(); }
  const h = seatTars[S.tar][0];
  if (isPastSlot(S.day, S.start)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(c.id, S.day, S.start, h)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, h)) { S.err = t("conflict"); haptic("warning"); return render(); }
  S.shot = "";
  S.shotImg = "";
  go("pay");
}

    suspended: !!c.suspended,
    hidden: !!c.hidden,
    open: Number.isFinite(Number(c.open)) ? Number(c.open) : 0,
    close: Number.isFinite(Number(c.close)) ? Number(c.close) : 24,
    addr: String(c.addr || ""),
    landmark: String(c.landmark || ""),
    lat: isValidLatLng(Number(c.lat), Number(c.lng)) ? Number(c.lat) : null,
    lng: isValidLatLng(Number(c.lat), Number(c.lng)) ? Number(c.lng) : null,
    mapUrl: String(c.mapUrl || ""),
    adminIds: normalizeAdminIds(c.adminIds, String(2000 + Number(c.id))),
    hourPrice: Number(c.hourPrice) || 30000,
    vipHourPrice: Number(c.vipHourPrice) || 45000,
    ps5HourPrice: Number(c.ps5HourPrice) || 42000,
    vrHourPrice: Number(c.vrHourPrice) || 55000,
    floorMap: c.floorMap || null
  };
  if (c.isCustom) {
    Object.assign(payload, {
      isCustom: true,
      logo: c.logo,
      name: c.name,
      addr: c.addr,
      landmark: c.landmark || "",
      mapUrl: c.mapUrl || "",
      open: c.open,
      close: c.close,
      card: c.card,
      subFee: Number(c.subFee) || 200000,
      gpu: c.gpu || "",
      specs: c.specs || null,
      contact: c.contact || null,
      amenities: Array.isArray(c.amenities) ? c.amenities : []
    });
  }
  fsSet(COL_CLUBS, String(c.id), payload);
}

async function submitPay() {
  if (S.submitting) return;
  if (!S.shot) { S.err = t("needShot"); haptic("warning"); return render(); }
  const c = C(S.club);
  const seatTars = c ? getTariffsForSeat(c, S.seat) : null;
  if (!c || S.tar === null || !seatTars || !seatTars[S.tar]) return go("home");
  const x = seatTars[S.tar];

  if (isPastSlot(S.day, S.start)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(c.id, S.day, S.start, x[0])) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, x[0])) { S.err = t("conflict"); haptic("warning"); return render(); }

  S.submitting = true;
  try {
    const newItem = {
      id: newBookingId(),
      club: c.id,
      seat: S.seat,
      day: S.day,
      start: S.start,
      hours: x[0],
      price: x[1],
      st: "new",
      by: "user",
      ownerId: getClientUserId(),
      shot: S.shot,
      shotImg: S.shotImg || "",
      created: Date.now()
    };
    bk.push(newItem);
    saveBookingCloud(newItem);
    notifyBotNewBooking("prod", newItem, c);
    haptic("success");
    S.view = "home";
    S.err = "";
    showToast(t("sent"));
  } finally {
    setTimeout(() => { S.submitting = false; }, 1200);
  }
}

async function decide(id, st) {
  const item = bk.find(b => String(b.id) === String(id));
  if (!item) return;
  item.st = st;
  saveBookingCloud(item);
  notifyBotBookingStatus("prod", item, C(item.club), st);
  haptic("success");
  render();
}

async function manual(clubId) {
  const s = S.ms, d = S.md, h = S.mh, n = S.mn;
  if (isPastSlot(d, h)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(clubId, d, h, n)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(clubId, s, d, h, n)) { S.err = t("conflict"); haptic("warning"); return render(); }
  const newItem = {
    id: newBookingId(),
    club: clubId,
    seat: s,
    day: d,
    start: h,
    hours: n,
    price: getBookingRevenue({ club: clubId, seat: s, hours: n }),
    st: "ok",
    by: "manual",
    created: Date.now()
  };
  bk.push(newItem);
  saveBookingCloud(newItem);
  S.err = "";
  S.tab = "active";
  haptic("success");
  render();
}

function setSysTab(k) {
  S.sysTab = k;
  haptic();
  render();
}

async function syncClubState(c) {
  saveClubCloud(c);
  return true;
}

async function clubAction(id, ok) {
  const c = C(id);
  if (!c) return;
  if (ok) {
    c.ok = true;
    c.gone = false;
    c.subPaid = true;
    c.suspended = false;
  } else {
    c.ok = false;
    c.gone = true;
  }
  saveBlueprintsLocal();
  await syncClubState(c);
  haptic("success");
  render();
}

function openClubSettings(clubId) {
  const c = C(clubId);
  if (!c) return;
  const stdBase = Number(c.hourPrice) || Math.round(minHour(c));
  S.settingsClubId = c.id;
  S.settingsDraft = {
    subPaid: c.subPaid !== false,
    suspended: !!c.suspended,
    hidden: !!c.hidden,
    open: Number.isFinite(Number(c.open)) ? Number(c.open) : 0,
    close: Number.isFinite(Number(c.close)) ? Number(c.close) : 24,
    addr: String(c.addr || ""),
    landmark: String(c.landmark || ""),
    locInput: formatClubLocInputValue(c),
    hourPrice: stdBase,
    vipHourPrice: Number(c.vipHourPrice) || Math.round(stdBase * 1.5),
    ps5HourPrice: Number(c.ps5HourPrice) || Math.round(stdBase * 1.4),
    vrHourPrice: Number(c.vrHourPrice) || Math.round(stdBase * 1.8),
    adminIds: normalizeAdminIds(c.adminIds, String(2000 + Number(c.id))).slice()
  };
  S.settingsAdminInput = "";
  S.settingsAdminErr = "";
  S.settingsConfirmAction = null;
  haptic();
  render();
}

function updateClubSettingsDirtyDOM() {
  if (S.settingsClubId === null || !S.settingsDraft) return;
  const dirty = isClubSettingsDirty();
  const adminsCount = S.settingsDraft.adminIds.length;
  const pending = String(S.settingsAdminInput || "").trim();
  const pendingValid = /^\d{1,20}$/.test(pending) && !S.settingsDraft.adminIds.includes(pending) && adminsCount < MAX_CLUB_ADMINS;
  const adminsValid = (adminsCount >= 1 && adminsCount <= MAX_CLUB_ADMINS) || (adminsCount === 0 && pendingValid);
  const badgeEl = $("club_settings_dirty_badge");
  if (badgeEl) {
    badgeEl.innerHTML = dirty
      ? `<span class="dirty-pill">● ${t("clubSettingsDirty")}</span>`
      : `<span class="clean-pill">✓ ${t("clubSettingsClean")}</span>`;
  }
  const saveBtn = $("club_settings_save_btn");
  if (saveBtn) {
    saveBtn.className = "cta-btn " + (dirty && adminsValid ? "ok" : (!dirty ? "btn-muted" : "btn-danger-soft"));
  }
}

function setDraftWorkMode(is247) {
  if (!S.settingsDraft) return;
  if (is247) {
    S.settingsDraft.open = 0;
    S.settingsDraft.close = 24;
  } else if (Number(S.settingsDraft.open) === 0 && Number(S.settingsDraft.close) === 24) {
    S.settingsDraft.open = 10;
    S.settingsDraft.close = 24;
  }
  haptic();
  render();
}

async function adminUpdateClubHours(clubId, openVal, closeVal) {
  const c = C(clubId);
  if (!c) return;
  if (S.authRole !== "sys" && Number(S.adminClubId) !== Number(c.id)) {
    haptic("warning");
    return;
  }
  c.open = Number.isFinite(Number(openVal)) ? Number(openVal) : 0;
  c.close = Number.isFinite(Number(closeVal)) ? Number(closeVal) : 24;
  c.nightPack = (c.open === 0 && c.close === 24) || (c.close < c.open);
  saveBlueprintsLocal();
  const ok = await syncClubState(c);
  if (!ok) return;
  haptic("success");
  showToast(`🕒 ${formatClubHoursLabel(c, true)}`);
}

function onDraftLocField(field, val) {
  if (!S.settingsDraft) return;
  S.settingsDraft[field] = val;
  if (field === "locInput") {
    const badge = $("cs_loc_badge");
    if (badge) {
      const ok = parseClubLocationInput(val).lat !== null;
      badge.className = "badge " + (ok ? "badge-green" : "badge-yellow");
      badge.textContent = ok ? t("mapExactPin") : t("mapTextSearch");
    }
  }
  updateClubSettingsDirtyDOM();
}

function detectGpsForSettingsDraft() {
  if (!S.settingsDraft) return;
  detectGpsForTarget(coordStr => {
    if (!S.settingsDraft) return;
    S.settingsDraft.locInput = coordStr;
    const inp = $("cs_loc_input");
    if (inp) inp.value = coordStr;
    onDraftLocField("locInput", coordStr);
  });
}

function detectGpsForAdminLoc() {
  detectGpsForTarget(coordStr => {
    const inp = $("admin_loc_coords");
    if (inp) inp.value = coordStr;
  });
}

function testAdminLocInput(clubId) {
  const c = C(clubId);
  const coordsEl = $("admin_loc_coords");
  const addrEl = $("admin_loc_addr");
  testLocationInputOnMap(coordsEl ? coordsEl.value : "", c ? c.name : "", addrEl ? addrEl.value : (c ? c.addr : ""));
}

async function adminSaveClubLocation(clubId) {
  const c = C(clubId);
  if (!c) return;
  if (S.authRole !== "sys" && Number(S.adminClubId) !== Number(c.id)) {
    haptic("warning");
    return;
  }
  const addrEl = $("admin_loc_addr");
  const lmEl = $("admin_loc_landmark");
  const coordsEl = $("admin_loc_coords");
  const newAddr = addrEl ? addrEl.value.trim() : c.addr;
  const newLm = lmEl ? lmEl.value.trim() : (c.landmark || "");
  const rawLoc = coordsEl ? coordsEl.value.trim() : "";
  const parsed = parseClubLocationInput(rawLoc);
  if (newAddr) c.addr = newAddr;
  c.landmark = newLm;
  c.lat = parsed.lat;
  c.lng = parsed.lng;
  c.mapUrl = parsed.mapUrl;
  saveBlueprintsLocal();
  const ok = await syncClubState(c);
  if (!ok) return;
  haptic("success");
  showToast(t("clubLocSavedToast"));
}

function setDraftField(field, val) {
  if (!S.settingsDraft) return;
  S.settingsDraft[field] = val;
  haptic();
  render();
}

function onDraftPriceInput(field, rawVal) {
  if (!S.settingsDraft) return;
  const num = Number(rawVal);
  S.settingsDraft[field] = Number.isFinite(num) ? num : 0;
  const lblEl = $(`cs_price_lbl_${field}`);
  if (lblEl) {
    lblEl.textContent = `${fm(Math.max(1000, Math.round(S.settingsDraft[field] || 0)))} ${t("per")}`;
  }
  updateClubSettingsDirtyDOM();
}

function stepDraftHourPrice(field, delta) {
  if (!S.settingsDraft) return;
  const cur = Number(S.settingsDraft[field]) || 10000;
  S.settingsDraft[field] = Math.max(1000, cur + delta);
  haptic();
  render();
}

function onDraftAdminInput(val) {
  S.settingsAdminInput = String(val ?? "");
  if (S.settingsAdminErr) {
    S.settingsAdminErr = "";
    const errEl = $("cs_admin_err_box");
    if (errEl) errEl.style.display = "none";
  }
  updateClubSettingsDirtyDOM();
}

function addDraftAdminId() {
  if (!S.settingsDraft) return;
  const raw = String(S.settingsAdminInput || "").trim();
  if (!/^\d{1,20}$/.test(raw)) {
    S.settingsAdminErr = t("clubAdminsErrFormat");
    haptic("warning");
    render();
    return;
  }
  if (S.settingsDraft.adminIds.length >= MAX_CLUB_ADMINS) {
    S.settingsAdminErr = t("clubAdminsErrMax");
    haptic("warning");
    render();
    return;
  }
  if (S.settingsDraft.adminIds.includes(raw)) {
    S.settingsAdminErr = t("clubAdminsErrDup");
    haptic("warning");
    render();
    return;
  }
  S.settingsDraft.adminIds.push(raw);
  S.settingsAdminInput = "";
  S.settingsAdminErr = "";
  haptic("success");
  render();
}

function removeDraftAdminId(aid) {
  if (!S.settingsDraft) return;
  S.settingsDraft.adminIds = S.settingsDraft.adminIds.filter(x => x !== String(aid));
  S.settingsAdminErr = S.settingsDraft.adminIds.length === 0 ? t("clubAdminsErrMin") : "";
  haptic();
  render();
}

function clearClubSettingsModalState() {
  S.settingsClubId = null;
  S.settingsDraft = null;
  S.settingsAdminInput = "";
  S.settingsAdminErr = "";
  S.settingsConfirmAction = null;
}

function requestCloseClubSettings() {
  if (S.settingsClubId === null) return;
  if (isClubSettingsDirty()) {
    S.settingsConfirmAction = "close";
    haptic("warning");
    render();
    return;
  }
  clearClubSettingsModalState();
  haptic();
  render();
}

function openBlueprintFromSettings() {
  if (S.settingsClubId === null) return;
  if (isClubSettingsDirty()) {
    S.settingsConfirmAction = "blueprint";
    haptic("warning");
    render();
    return;
  }
  const targetId = S.settingsClubId;
  clearClubSettingsModalState();
  openClubBlueprintEditor(targetId);
}

function cancelSettingsConfirm() {
  S.settingsConfirmAction = null;
  haptic();
  render();
}

function confirmDiscardClubSettings() {
  const action = S.settingsConfirmAction;
  const targetId = S.settingsClubId;
  clearClubSettingsModalState();
  haptic("warning");
  if (action === "blueprint" && targetId) {
    openClubBlueprintEditor(targetId);
    return;
  }
  if (action === "admin" && targetId) {
    S.adminClubId = targetId;
    S.role = "admin";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  render();
}

async function saveClubSettingsDraft() {
  if (S.settingsClubId === null || !S.settingsDraft) return;
  const c = C(S.settingsClubId);
  if (!c) return;
  const d = S.settingsDraft;

  // Если пользователь ввёл TG ID в поле и сразу нажал «Сохранить» — валидируем и добавляем автоматически
  const pendingAdmin = String(S.settingsAdminInput || "").trim();
  if (pendingAdmin) {
    if (!/^\d{1,20}$/.test(pendingAdmin)) {
      S.settingsAdminErr = t("clubAdminsErrFormat");
      haptic("warning");
      render();
      return;
    }
    if (d.adminIds.includes(pendingAdmin)) {
      S.settingsAdminErr = t("clubAdminsErrDup");
      haptic("warning");
      render();
      return;
    }
    if (d.adminIds.length >= MAX_CLUB_ADMINS) {
      S.settingsAdminErr = t("clubAdminsErrMax");
      haptic("warning");
      render();
      return;
    }
    d.adminIds.push(pendingAdmin);
    S.settingsAdminInput = "";
  }

  if (d.adminIds.length < 1) {
    S.settingsAdminErr = t("clubAdminsErrMin");
    haptic("warning");
    render();
    return;
  }
  if (d.adminIds.length > MAX_CLUB_ADMINS) {
    S.settingsAdminErr = t("clubAdminsErrMax");
    haptic("warning");
    render();
    return;
  }

  if (!isClubSettingsDirty()) {
    clearClubSettingsModalState();
    haptic();
    showToast(t("clubSettingsNoChanges"));
    return;
  }

  c.subPaid = !!d.subPaid;
  c.suspended = !!d.suspended;
  c.hidden = !!d.hidden;
  c.open = Number.isFinite(Number(d.open)) ? Number(d.open) : 0;
  c.close = Number.isFinite(Number(d.close)) ? Number(d.close) : 24;
  c.nightPack = (c.open === 0 && c.close === 24) || (c.close < c.open);
  if (String(d.addr || "").trim()) c.addr = String(d.addr).trim();
  c.landmark = String(d.landmark || "").trim();
  const parsedLoc = parseClubLocationInput(d.locInput);
  c.lat = parsedLoc.lat;
  c.lng = parsedLoc.lng;
  c.mapUrl = parsedLoc.mapUrl;
  c.adminIds = normalizeAdminIds(d.adminIds);
  applyClubHourPrice(c, d.hourPrice, d.vipHourPrice, d.ps5HourPrice, d.vrHourPrice);
  saveBlueprintsLocal();
  const ok = await syncClubState(c);
  if (!ok) return;
  applyPersonaRoleFromClubAdmins(S.persona, false);
  clearClubSettingsModalState();
  haptic("success");
  showToast(t("clubSettingsSavedToast"));
}

async function pullCloudStateOnce() {
  try {
    const [remoteBk, remoteClubs, remoteRatings] = await Promise.all([
      fsList(COL_BOOKINGS),
      fsList(COL_CLUBS),
      fsList(COL_RATINGS)
    ]);
    let changed = false;

    if (Array.isArray(remoteBk)) {
      fbLive = true;
      if (remoteBk.length === 0 && !seededBookings) {
        seededBookings = true;
        bk.forEach(item => saveBookingCloud(item));
      } else if (remoteBk.length > 0) {
        remoteBk.sort((a, b) => (a.created || 0) - (b.created || 0) || String(a.id).localeCompare(String(b.id)));
        const sigBk = JSON.stringify(remoteBk.map(x => [x.id, x.st, x.seat, x.start, x.hours]));
        const curBk = JSON.stringify(bk.map(x => [x.id, x.st, x.seat, x.start, x.hours]));
        if (sigBk !== curBk) {
          bk = remoteBk;
          changed = true;
        }
      }
    }

    if (Array.isArray(remoteClubs)) {
      if (remoteClubs.length === 0 && !seededClubs) {
        seededClubs = true;
        clubs.forEach(c => saveClubCloud(c));
      } else if (remoteClubs.length > 0) {
        const sigClubs = JSON.stringify(remoteClubs);
        if (sigClubs !== _lastCloudSig) {
          _lastCloudSig = sigClubs;
          remoteClubs.forEach(data => {
            const target = C(data.id) || upsertClubFromData(data);
            if (target) {
              target.ok = !!data.ok;
              target.gone = !!data.gone;
              if (typeof data.subPaid === "boolean") target.subPaid = data.subPaid;
              if (typeof data.suspended === "boolean") target.suspended = data.suspended;
              if (typeof data.hidden === "boolean") target.hidden = data.hidden;
              if (Number.isFinite(Number(data.open))) target.open = Number(data.open);
              if (Number.isFinite(Number(data.close))) target.close = Number(data.close);
              if (typeof data.addr === "string" && data.addr.trim()) target.addr = data.addr.trim();
              if (typeof data.landmark === "string") target.landmark = data.landmark;
              if (data.lat !== undefined || data.lng !== undefined) {
                target.lat = isValidLatLng(Number(data.lat), Number(data.lng)) ? Number(data.lat) : null;
                target.lng = isValidLatLng(Number(data.lat), Number(data.lng)) ? Number(data.lng) : null;
              }
              if (typeof data.mapUrl === "string") target.mapUrl = data.mapUrl;
              if (Array.isArray(data.adminIds) && data.adminIds.length) {
                target.adminIds = normalizeAdminIds(data.adminIds, String(2000 + Number(target.id)));
              }
              if (Number(data.hourPrice) > 0 || Number(data.vipHourPrice) > 0 || Number(data.ps5HourPrice) > 0 || Number(data.vrHourPrice) > 0) {
                applyClubHourPrice(
                  target,
                  Number(data.hourPrice) || target.hourPrice,
                  Number(data.vipHourPrice) || target.vipHourPrice,
                  Number(data.ps5HourPrice) || target.ps5HourPrice,
                  Number(data.vrHourPrice) || target.vrHourPrice
                );
              }
              if (data.floorMap && data.floorMap.size && data.floorMap.cells) {
                target.floorMap = data.floorMap;
              }
            }
          });
          applyPersonaRoleFromClubAdmins(S.persona, false);
          changed = true;
        }
      }
    }

    if (Array.isArray(remoteRatings) && remoteRatings.length > 0) {
      const merged = { ...clubRatings };
      let rChanged = false;
      remoteRatings.forEach(d => {
        if (d && d.clubId && d.uid && d.stars) {
          const rk = `${d.clubId}_${d.uid}`;
          if (!merged[rk] || merged[rk].stars !== d.stars) rChanged = true;
          merged[rk] = d;
        }
      });
      if (rChanged) {
        clubRatings = merged;
        try { localStorage.setItem("nova_prod_ratings_v1", JSON.stringify(clubRatings)); } catch (e) {}
        changed = true;
      }
    }

    if (changed) safeRenderPreserveModalFocus();
  } catch (e) {}
}

function initFirebase() {
  if (!FIREBASE_CONFIG.projectId) return;
  pullCloudStateOnce();
  setInterval(pullCloudStateOnce, 12000);
}

setInterval(() => {
  const now = Date.now();
  let ch = false;
  bk.forEach(b => {
    if (b.st === "new" && b.created && b.created + 3e5 <= now) {
      b.st = "exp";
      ch = true;
      // Обновляем в облаке только владелец или админ, чтобы избежать шторма записей
      if (db && (S.role === "admin" || String(b.ownerId || "") === String(getClientUserId()))) {
        fsPatchField(COL_BOOKINGS, String(b.id), "st", "exp");
      }
    }
  });
  if (ch && (S.role !== "user" || S.view === "home")) return safeRenderPreserveModalFocus();
  document.querySelectorAll("[data-exp]").forEach(e => {
    const r = Math.max(0, +e.dataset.exp - now);
    e.textContent = String(Math.floor(r / 6e4)).padStart(2, "0") + ":" + String(Math.floor(r / 1e3) % 60).padStart(2, "0");
  });
}, 1000);

applyPersonaRoleFromClubAdmins(S.persona, true);
render();
initFirebase();
if (tg) {
  setTimeout(() => {
    try {
      if (tg.ready) tg.ready();
      if (tg.expand) tg.expand();
    } catch (e) {}
  }, 80);
}

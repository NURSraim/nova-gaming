<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nova Gaming — Cyber Lounge & PC Booking</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0914;
  --bg-gradient: radial-gradient(circle at 50% 0%, #1f1442 0%, #0b0914 70%);
  --surface: rgba(26, 21, 48, 0.7);
  --surface-hover: rgba(38, 30, 71, 0.85);
  --surface-card: rgba(22, 17, 43, 0.75);
  --border: rgba(140, 120, 240, 0.15);
  --border-focus: rgba(0, 240, 255, 0.5);
  
  --text: #f5f3ff;
  --text-muted: #948db8;
  --text-dim: #625b85;
  
  --neon-cyan: #00f0ff;
  --neon-purple: #8b5cf6;
  --neon-green: #00ffa3;
  --neon-red: #ff3366;
  --neon-gold: #ffb703;
  
  --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #00f0ff 100%);
  --accent-glow: 0 0 25px rgba(139, 92, 246, 0.4);
  --green-glow: 0 0 15px rgba(0, 255, 163, 0.3);
  --gold-glow: 0 0 18px rgba(255, 183, 3, 0.4);
  
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

button, .club-card, .tariff-card, .chip-btn, .seat-btn, .file-upload-zone {
  touch-action: manipulation;
  cursor: pointer;
}

body {
  background: var(--bg);
  background-image: var(--bg-gradient);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

#app {
  max-width: 460px;
  margin: 0 auto;
  padding: 14px 16px 98px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.anim-fade {
  animation: fadeIn 0.18s ease-out;
}

/* Top Role Switcher Bar */
.top-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.role-seg {
  display: flex;
  flex: 1;
  background: rgba(18, 14, 34, 0.95);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 4px;
}

.role-btn {
  flex: 1;
  background: none;
  border: 0;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.role-btn.active {
  background: var(--accent-grad);
  color: #fff;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
  font-weight: 700;
}

.lang-btn {
  background: rgba(18, 14, 34, 0.95);
  border: 1px solid var(--border);
  color: var(--neon-cyan);
  font-weight: 700;
  font-size: 12px;
  border-radius: var(--radius-md);
  padding: 9px 13px;
  cursor: pointer;
}

.brand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.brand-badge {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

.brand-logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent-grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  box-shadow: var(--accent-glow);
}

h2.section-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Club Cards */
.club-card {
  background: rgba(22, 17, 43, 0.92);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  text-align: left;
  display: block;
  width: 100%;
}

.club-card:active {
  border-color: rgba(139, 92, 246, 0.55);
  background: rgba(32, 24, 62, 0.96);
}

.club-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.club-name {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
}

.club-addr {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 12px;
}

.club-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.badge-green {
  background: rgba(0, 255, 163, 0.12);
  color: var(--neon-green);
  border: 1px solid rgba(0, 255, 163, 0.25);
}

.badge-purple {
  background: rgba(139, 92, 246, 0.15);
  color: #c4b5fd;
  border: 1px solid rgba(139, 92, 246, 0.3);
}

.badge-price {
  background: rgba(0, 240, 255, 0.12);
  color: var(--neon-cyan);
  border: 1px solid rgba(0, 240, 255, 0.25);
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

.back-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 7px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin-bottom: 12px;
}

.legend-bar {
  display: flex;
  gap: 16px;
  background: rgba(18, 14, 34, 0.6);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  margin: 12px 0 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-box {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}

.grid-main {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}

.grid-vip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.seat-btn {
  aspect-ratio: 1;
  background: rgba(26, 21, 48, 0.6);
  border: 2px solid var(--neon-green);
  border-radius: 12px;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.seat-btn::after {
  content: 'ПК';
  font-size: 9px;
  color: var(--neon-green);
  font-weight: 500;
  margin-top: 2px;
}

.seat-btn:active {
  transform: scale(0.9);
}

.seat-btn.vip {
  border-color: var(--neon-gold);
  background: rgba(255, 183, 3, 0.08);
}

.seat-btn.vip::after {
  content: 'VIP';
  color: var(--neon-gold);
}

.seat-btn.busy {
  border-color: rgba(255, 51, 102, 0.4);
  background: rgba(255, 51, 102, 0.08);
  color: var(--text-dim);
  cursor: not-allowed;
  opacity: 0.6;
}

.seat-btn.busy::after {
  content: 'ЗАНЯТ';
  color: var(--neon-red);
}

.chip-group {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.chip-btn {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: var(--radius-md);
  padding: 11px 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}

.chip-btn.active {
  background: var(--accent-grad);
  color: #fff;
  border-color: transparent;
  box-shadow: var(--accent-glow);
  font-weight: 700;
}

.styled-select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: #fff;
  padding: 13px 14px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  outline: none;
  cursor: pointer;
}

.styled-select:focus {
  border-color: var(--neon-cyan);
}

.tariff-card {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  cursor: pointer;
  color: var(--text);
}

.tariff-card.active {
  border-color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.08);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
}

.tariff-card b {
  font-family: 'JetBrains Mono', monospace;
  color: var(--neon-cyan);
  font-size: 16px;
}

.cta-btn {
  width: 100%;
  background: var(--accent-grad);
  border: 0;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.2px;
  padding: 16px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  margin-top: 14px;
  box-shadow: var(--accent-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.cta-btn:active {
  transform: scale(0.97);
}

.cta-btn.ok {
  background: linear-gradient(135deg, #00ffa3 0%, #00b4d8 100%);
  color: #05261e;
  box-shadow: var(--green-glow);
}

.cta-btn.no {
  background: rgba(255, 51, 102, 0.15);
  border: 1px solid rgba(255, 51, 102, 0.3);
  color: var(--neon-red);
}

.card-box {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 18px;
  margin-bottom: 12px;
}

.card-number-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  margin: 10px 0;
  background: rgba(0, 0, 0, 0.35);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px dashed rgba(0, 240, 255, 0.3);
  text-align: center;
}

.file-upload-zone {
  display: block;
  border: 2px dashed var(--border);
  background: rgba(26, 21, 48, 0.35);
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  margin-top: 14px;
}

.toast-msg {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #00ffa3 0%, #00b4d8 100%);
  color: #05261e;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 14px;
  box-shadow: 0 8px 24px rgba(0, 255, 163, 0.4);
  z-index: 999;
  animation: fadeIn 0.3s ease;
}

.error-text {
  color: var(--neon-red);
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
}

.status-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  margin-top: 8px;
}
.st-new { background: rgba(255, 183, 3, 0.15); color: var(--neon-gold); border: 1px solid rgba(255, 183, 3, 0.3); }
.st-ok { background: rgba(0, 255, 163, 0.15); color: var(--neon-green); border: 1px solid rgba(0, 255, 163, 0.3); }
.st-no { background: rgba(255, 51, 102, 0.15); color: var(--neon-red); border: 1px solid rgba(255, 51, 102, 0.3); }

.row-btns {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.row-btns .cta-btn {
  margin-top: 0;
}

/* Club Card Info (?) Button & Rating */
.club-head-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.club-info-btn {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.45);
  color: var(--neon-cyan);
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.22);
  transition: all 0.2s ease;
}

.club-info-btn:hover {
  background: rgba(0, 240, 255, 0.2);
  box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
  transform: translateY(-1px);
}

.club-info-btn:active {
  transform: scale(0.92);
}

.badge-gold {
  background: rgba(255, 183, 3, 0.14);
  color: var(--neon-gold);
  border: 1px solid rgba(255, 183, 3, 0.35);
}

/* Glassmorphic Club Info Modal */
@keyframes modalPop {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 5, 16, 0.88);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.info-modal {
  width: 100%;
  max-width: 410px;
  max-height: 90vh;
  overflow-y: auto;
  background: linear-gradient(165deg, rgba(24, 19, 46, 0.97) 0%, rgba(12, 9, 25, 0.99) 100%);
  border: 1px solid rgba(139, 92, 246, 0.5);
  border-radius: 26px;
  padding: 20px;
  position: relative;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 42px rgba(139, 92, 246, 0.25), 0 0 24px rgba(0, 240, 255, 0.14);
  animation: modalPop 0.26s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-close-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.modal-close-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
}

.club-modal-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding-right: 30px;
}

.club-avatar-ring {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, #00f0ff 0%, #8b5cf6 100%);
  box-shadow: 0 0 22px rgba(0, 240, 255, 0.32), 0 0 26px rgba(139, 92, 246, 0.35);
  flex-shrink: 0;
}

.club-avatar-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, rgba(0, 240, 255, 0.2), #0e0b1d 72%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -1px;
}

.club-avatar-letter {
  background: linear-gradient(135deg, #00f0ff 0%, #c084fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.club-modal-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  letter-spacing: -0.3px;
}

.club-modal-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: 13px;
}

.club-modal-stars {
  color: var(--neon-gold);
  font-weight: 800;
}

.contact-pill {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
  padding: 5px 11px;
  border-radius: 99px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.4);
  font-size: 12px;
  font-weight: 600;
}

.contact-link {
  color: #a5f3fc;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

.contact-link:hover {
  color: #fff;
}

.info-row-box {
  background: rgba(14, 11, 29, 0.82);
  border: 1px solid rgba(140, 120, 240, 0.22);
  border-radius: 14px;
  padding: 11px 13px;
  margin-bottom: 9px;
}

.live-seats-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(0, 255, 163, 0.08);
  border: 1px solid rgba(0, 255, 163, 0.32);
  border-radius: 14px;
  padding: 10px 13px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--neon-green);
}

.live-seats-box.full {
  background: rgba(255, 51, 102, 0.1);
  border-color: rgba(255, 51, 102, 0.35);
  color: #ff8fa3;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 10px var(--neon-green);
  animation: pulseDot 1.6s infinite;
  flex-shrink: 0;
}

.spec-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #e9e4ff;
  line-height: 1.35;
}

.spec-line + .spec-line {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(140, 120, 240, 0.12);
}

.spec-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 6px;
  letter-spacing: 0.4px;
  flex-shrink: 0;
}

.spec-tag-std {
  background: var(--neon-cyan);
  color: #061822;
}

.spec-tag-vip {
  background: var(--neon-gold);
  color: #261600;
}

.addr-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.map-outline-btn {
  padding: 6px 11px;
  border-radius: 10px;
  border: 1px solid rgba(0, 240, 255, 0.55);
  background: rgba(0, 240, 255, 0.08);
  color: var(--neon-cyan);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.map-outline-btn:hover {
  background: rgba(0, 240, 255, 0.18);
}

.amenities-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.amenity-pill {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(140, 120, 240, 0.22);
  border-radius: 99px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  color: #e2ddf8;
}

.rate-trigger-btn {
  width: 100%;
  background: none;
  border: 0;
  color: var(--neon-gold);
  font-size: 13px;
  font-weight: 700;
  margin-top: 12px;
  padding: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: underline;
  text-underline-offset: 4px;
}

.rate-drawer {
  margin-top: 10px;
  padding: 12px;
  border-radius: 14px;
  background: rgba(255, 183, 3, 0.07);
  border: 1px solid rgba(255, 183, 3, 0.28);
  text-align: center;
  animation: fadeIn 0.2s ease;
}

.rate-drawer.locked {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(140, 120, 240, 0.25);

const abs = (d, s) => d * 24 + s;

function isPastSlot(d, s) {
  return d === 0 && s < new Date().getHours();
}

function isBookingSessionEnded(b) {
  const startH = Number(b.start) || 0;
  const hrs = Number(b.hours) || 1;
  const dayOffset = Number(b.day) || 0;
  const nowH = new Date().getHours();
  if (dayOffset === 0 && (startH + hrs) <= nowH) return true;
  if (b.created && Number(b.created) > 1e12) {
    const d = new Date(Number(b.created));
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + dayOffset);
    const endTs = d.getTime() + (startH + hrs) * 3600 * 1000;
    if (Date.now() >= endTs) return true;
  }
  return false;
}

function isBookingActive(b) {
  if (!b || (b.st !== "ok" && b.st !== "new")) return false;
  if (isBookingSessionEnded(b)) return false;
  return true;
}

function clash(c, seat, d, s, h) {
  const a = abs(d, s), e = a + h;
  return bk.some(b => Number(b.club) === Number(c) && String(b.seat) === String(seat) && isBookingActive(b) && a < abs(Number(b.day) || 0, Number(b.start) || 0) + (Number(b.hours) || 1) && abs(Number(b.day) || 0, Number(b.start) || 0) < e);
}

function closedAt(c, d, s, h) {
  const k = C(c);
  if (!k) return true;
  return !(k.open === 0 && k.close === 24) && (s < k.open || s + h > k.close);
}

function minHour(c) {
  return Math.min(...c.tar.map(x => x[1] / x[0]));
}

  return `<span class="status-tag ${cls}">${txt}</span>`;
}

function getLiveFreeSeats(clubId) {
  const nowH = new Date().getHours();
  const freeStd = MAIN.filter(s => !clash(clubId, s, 0, nowH, 1)).length;
  const freeVip = VIP.filter(s => !clash(clubId, s, 0, nowH, 1)).length;
  return { freeStd, totalStd: MAIN.length, freeVip, totalVip: VIP.length };
}

function getClubRating(c) {
  const baseSum = (c.baseRating && Number(c.baseRating.sum)) || 0;
  const baseCount = (c.baseRating && Number(c.baseRating.count)) || 0;
  const votes = Object.values(clubRatings).filter(
    v => v && Number(v.clubId) === Number(c.id) && Number(v.stars) >= 1 && Number(v.stars) <= 5
  );
  const totalCount = baseCount + votes.length;
  if (!totalCount) return { avg: null, count: 0 };
  const totalSum = baseSum + votes.reduce((acc, v) => acc + Number(v.stars), 0);
  return { avg: (totalSum / totalCount).toFixed(1), count: totalCount };
}

function reviewsLabel(n) {
  if (S.lang === "uz") return `${n} ta baho`;
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return `${n} отзыв`;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return `${n} отзыва`;
  return `${n} отзывов`;
}

function bkTab(k, clubId) {
  return bk.filter(b => b.club === clubId && (k === "no" ? (b.st === "no" || b.st === "exp") : b.st === k));
}

function getBookingRevenue(b) {
  if (!b) return 0;
  if (Number(b.price) > 0) return Number(b.price);
  const c = C(b.club);
  if (!c) return 0;
  const hrs = Number(b.hours) || 1;
  const exactTar = Array.isArray(c.tar) ? c.tar.find(x => Number(x[0]) === hrs) : null;
  if (exactTar) return Number(exactTar[1]) || 0;
  return Math.round(minHour(c) * hrs);
}

      const isSusp = !!c.suspended;
      return `
        <div class="card-box anim-fade" style="border-color:${isSusp ? "rgba(255,51,102,0.45)" : "var(--border)"};">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div style="font-size:16px;font-weight:800;color:#fff;">${escHtml(c.name)}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">📍 ${escHtml(c.addr)}</div>
            </div>
            <span class="badge ${isSusp ? "badge-red" : "badge-green"}">
              ${isSusp ? "⛔ " + t("netSuspended") : "⚡ " + t("netOnline")}
            </span>
          </div>

          <div class="info-row-box" style="margin-top:12px;margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:8px;">
              <span style="color:var(--text-muted);">${t("subFeeLabel")}:</span>
              <b style="font-family:'JetBrains Mono',monospace;color:var(--neon-cyan);">${fm(c.subFee || 500000)} ${t("perMonth")}</b>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <span class="badge ${isPaid ? "badge-green" : "badge-red"}" style="font-size:12px;">
                ${isPaid ? "🟢 " + t("subPaidYes") : "🔴 " + t("subPaidNo")}
              </span>
              <button class="receipt-mini-btn" onclick="toggleClubSub(${c.id})">
                ${isPaid ? t("subMarkUnpaid") : t("subMarkPaid")}
              </button>
            </div>
          </div>

          <button class="cta-btn ${isSusp ? "ok" : "no"}" style="margin-top:6px;padding:11px;" onclick="toggleClubAccess(${c.id})">
            ${isSusp ? t("btnRestore") : t("btnSuspend")}
          </button>
        </div>
      `;
    }).join("") || `<p style="color:var(--text-muted);text-align:center;padding:24px 0;">${t("empty")}</p>`;

    return `
      <div class="anim-fade">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">💳 ${t("subsTitle")}</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">${t("subsHint")}</p>
        ${subCards}
      </div>
    `;
  }

  // Вкладка 3: Аналитика прибыли владельцев каждого клуба
  const connected = clubs.filter(c => c.ok);
  const statsPerClub = connected.map(c => {
    const clubBks = bk.filter(b => Number(b.club) === Number(c.id) && b.st === "ok");
    const onlineBks = clubBks.filter(b => b.by === "user");
    const manualBks = clubBks.filter(b => b.by === "manual");
    const revenue = clubBks.reduce((acc, b) => acc + getBookingRevenue(b), 0);
    const hours = clubBks.reduce((acc, b) => acc + (Number(b.hours) || 1), 0);
    const avg = clubBks.length ? Math.round(revenue / clubBks.length) : 0;
    return {
      club: c,
      totalCount: clubBks.length,
      onlineCount: onlineBks.length,
      manualCount: manualBks.length,
      revenue,
      hours,
      avg
    };
  }).sort((a, b) => b.revenue - a.revenue);

  const totalPlatformRev = statsPerClub.reduce((acc, s) => acc + s.revenue, 0);
  const totalPlatformSessions = statsPerClub.reduce((acc, s) => acc + s.totalCount, 0);

  const statCards = statsPerClub.map(s => {
    const sharePct = totalPlatformRev > 0 ? Math.round((s.revenue / totalPlatformRev) * 100) : 0;
    return `
      <div class="card-box anim-fade">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div>
            <b style="font-size:16px;">${escHtml(s.club.name)}</b>
            <p style="font-size:11px;color:var(--text-muted);margin-top:2px;">📍 ${escHtml(s.club.addr)}</p>
          </div>
          <span class="badge ${s.club.suspended ? "badge-red" : "badge-green"}">
            ${s.club.suspended ? "⛔" : "🟢"} ${sharePct}%
          </span>
        </div>

        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-size:12px;color:var(--text-muted);">${t("ownerProfit")}:</span>
          <span style="font-size:19px;font-weight:800;color:var(--neon-green);font-family:'JetBrains Mono',monospace;">
            ${fm(s.revenue)}
          </span>
        </div>

        <div class="analytics-bar-track">
          <div class="analytics-bar-fill" style="width:${Math.max(4, sharePct)}%;"></div>
        </div>

        <div class="analytics-grid">
          <div class="analytics-cell">${t("onlineBkCount")}<b>${s.onlineCount}</b></div>
          <div class="analytics-cell">${t("manualBkCount")}<b>${s.manualCount}</b></div>
          <div class="analytics-cell">${t("hoursSold")}<b>${s.hours} ${t("h")}</b></div>
          <div class="analytics-cell">${t("avgCheck")}<b>${fm(s.avg)}</b></div>
        </div>
      </div>
    `;
  }).join("");

  return `
    <div class="anim-fade">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">📊 ${t("statTitle")}</h1>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">${t("statHint")}</p>

      <div class="history-stats">
        <div class="stat-card">
          <div class="stat-label">💰 ${t("totalNetRev")}</div>
          <div class="stat-value" style="color:var(--neon-green);font-size:15px;">${fm(totalPlatformRev)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">🎟️ ${t("totalNetSessions")}</div>
          <div class="stat-value" style="color:var(--neon-cyan);">${totalPlatformSessions}</div>
        </div>
      </div>

      ${statCards}
    </div>
  `;
}

function sysBottomNav() {
  if (S.role !== "sys") return "";
  const pendCount = clubs.filter(c => !c.ok && !c.gone).length;
  const unpaidCount = clubs.filter(c => c.ok && (c.subPaid === false || c.suspended)).length;
  return `
    <div class="bottom-nav-dock">
      <button class="bottom-nav-btn ${S.sysTab === "requests" ? "active" : ""}" onclick="setSysTab('requests')">
        <span>📥 ${t("sysNavReq")}</span>
        ${pendCount ? `<span class="nav-count-pill">${pendCount}</span>` : ""}
      </button>
      <button class="bottom-nav-btn ${S.sysTab === "subs" ? "active" : ""}" onclick="setSysTab('subs')">
        <span>💳 ${t("sysNavSubs")}</span>
        ${unpaidCount ? `<span class="nav-count-pill" style="background:rgba(255,51,102,0.45);">${unpaidCount}</span>` : ""}
      </button>
      <button class="bottom-nav-btn ${S.sysTab === "analytics" ? "active" : ""}" onclick="setSysTab('analytics')">
        <span>📊 ${t("sysNavStat")}</span>
      </button>
    </div>
  `;
}

let toastTimer = null;
function showToast(msg) {
  S.toast = msg;
  if (toastTimer) clearTimeout(toastTimer);
  render();
  toastTimer = setTimeout(() => { S.toast = ""; toastTimer = null; render(); }, 3000);
}

function render() {
  if (S.role !== "user" && S.role !== S.authRole) {
    S.role = "user";
  }
  const views = { home, club: clubView, seat: seatView, pay: payView, history: historyView };
  const viewFn = views[S.view] || home;
  const v = S.role === "admin" ? adminView() : S.role === "sys" ? sysView() : viewFn();
  $("app").innerHTML = head() + v + playerBottomNav() + sysBottomNav() + clubInfoModal() + receiptModal() + (S.toast ? `<div class="toast-msg">${escHtml(S.toast)}</div>` : "");
}

function setRole(r) {
  if (r !== "user" && r !== S.authRole) return;
  S.role = r;
  S.err = "";
  haptic();
  render();
}

function showMyTgId() {
  const uid = getClientUserId();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(String(uid)).catch(() => {});
  }
  haptic("success");
  showToast("🆔 ID: " + uid + " (скопировано)");
}

function setLang() { S.lang = S.lang === "ru" ? "uz" : "ru"; haptic(); render(); }
function go(v) { S.view = v; S.err = ""; haptic(); render(); }
function openClub(id) { S.club = id; go("club"); }
function openSeat(s) { S.seat = s; S.start = null; S.tar = null; S.day = 0; go("seat"); }

function onShotPicked(input) {
  const name = input.files && input.files[0] ? input.files[0].name : "";
  S.shot = name;
  S.err = "";
  const fnEl = $("fn");
  if (fnEl) fnEl.textContent = name ? ("📎 " + name) : t("attach");
  haptic();
}

function copyCard(num) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(num).catch(() => {});
  }
  haptic("success");
  showToast(t("copiedToast"));
}

function copyPhone(phone) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(phone).catch(() => {});
  }
  haptic("success");
  showToast(t("phoneCopied") + " " + phone);
}

function openClubInfo(id, ev) {
  if (ev) ev.stopPropagation();
  S.infoClubId = id;
  S.ratingOpen = false;
  haptic();
  render();
}

function closeClubInfo() {
  S.infoClubId = null;
  S.ratingOpen = false;
  haptic();
  render();
}

function chooseSeatFromModal(id) {
  S.infoClubId = null;
  S.ratingOpen = false;
  openClub(id);
}

function toggleRateDrawer() {
  S.ratingOpen = !S.ratingOpen;
  haptic();
  render();
}

function submitClubRating(clubId, stars) {
  const uid = getClientUserId();
  if (!hasConfirmedVisit(clubId, uid)) {
    haptic("warning");
    showToast("🔒 " + t("rateLocked"));
    return;
  }
  const s = Math.max(1, Math.min(5, Number(stars) || 0));
  const key = `${clubId}_${uid}`;
  const rec = { clubId: Number(clubId), uid: String(uid), stars: s, updatedAt: Date.now() };
  clubRatings[key] = rec;
  try {
    localStorage.setItem("nova_ratings_v1", JSON.stringify(clubRatings));
  } catch (e) {}
  if (db) {
    db.collection(COL_RATINGS).doc(key).set(rec).catch(() => {});
  }
  haptic("success");
  showToast(t("ratedToast"));
}

function setHistTab(k) {
  S.histTab = k;
  haptic();
  render();
}

function openReceipt(id) {
  S.receiptId = id;
  haptic();
  render();
}

function closeReceipt() {
  S.receiptId = null;
  haptic();
  render();
}

function rateClubFromHistory(clubId, ev) {
  if (ev) ev.stopPropagation();
  S.infoClubId = clubId;
  S.ratingOpen = true;
  haptic();
  render();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (S.receiptId !== null) closeReceipt();
    else if (S.infoClubId !== null) closeClubInfo();
  }
});

function newBookingId() {
  return "bk_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
}

function toPay() {
  const c = C(S.club);
  if (!c) return go("home");
  if (S.tar === null || !c.tar[S.tar]) { S.err = t("pick"); haptic("warning"); return render(); }
  const h = c.tar[S.tar][0];
  if (isPastSlot(S.day, S.start)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(c.id, S.day, S.start, h)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, h)) { S.err = t("conflict"); haptic("warning"); return render(); }
  S.shot = "";
  go("pay");
}

function saveBookingCloud(item) {
  if (!db) return;
  db.collection(COL_BOOKINGS).doc(String(item.id)).set(item).catch(console.error);
}

function saveClubCloud(c) {
  if (!db) return;
  db.collection(COL_CLUBS).doc(String(c.id)).set({
    id: c.id,
    ok: !!c.ok,
    gone: !!c.gone,
    subPaid: c.subPaid !== false,
    suspended: !!c.suspended
  }).catch(console.error);
}

function submitPay() {
  if (!S.shot) { S.err = t("needShot"); haptic("warning"); return render(); }
  const c = C(S.club);
  if (!c || S.tar === null || !c.tar[S.tar]) return go("home");
  const x = c.tar[S.tar];

  // Повторная проверка перед записью (защита от двойного бронирования)
  if (isPastSlot(S.day, S.start)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(c.id, S.day, S.start, x[0])) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(c.id, S.seat, S.day, S.start, x[0])) { S.err = t("conflict"); haptic("warning"); return render(); }

  const newItem = {
    id: newBookingId(),
    club: c.id,
    seat: S.seat,
    day: S.day,
    start: S.start,
    hours: x[0],
    price: x[1],
    st: "new",
    by: "user",
    ownerId: getClientUserId(),
    shot: S.shot,
    created: Date.now()
  };
  bk.push(newItem);
  saveBookingCloud(newItem);
  haptic("success");
  S.view = "home";
  S.err = "";
  showToast(t("sent"));
}

function decide(id, st) {
  const item = bk.find(b => String(b.id) === String(id));
  if (item) {
    item.st = st;
    saveBookingCloud(item);
  }
  haptic("success");
  render();
}

function manual(clubId) {
  const s = S.ms, d = S.md, h = S.mh, n = S.mn;
  if (isPastSlot(d, h)) { S.err = t("pastTime"); haptic("warning"); return render(); }
  if (closedAt(clubId, d, h, n)) { S.err = t("closed"); haptic("warning"); return render(); }
  if (clash(clubId, s, d, h, n)) { S.err = t("conflict"); haptic("warning"); return render(); }
  const newItem = {
    id: newBookingId(),
    club: clubId,
    seat: s,
    day: d,
    start: h,
    hours: n,
    st: "ok",
    by: "manual",
    created: Date.now()
  };
  bk.push(newItem);
  saveBookingCloud(newItem);
  S.err = "";
  S.tab = "ok";
  haptic("success");
  render();
}

function setSysTab(k) {
  S.sysTab = k;
  haptic();
  render();
}

function clubAction(id, ok) {
  const c = C(id);
  if (!c) return;
  if (ok) {
    c.ok = true;
    c.gone = false;
    c.subPaid = true;
    c.suspended = false;
  } else {
    c.ok = false;
    c.gone = true;
  }
  saveClubCloud(c);
  haptic("success");
  render();
}

function toggleClubSub(id) {
  const c = C(id);
  if (!c) return;
  c.subPaid = !(c.subPaid !== false);
  saveClubCloud(c);
  haptic("success");
  render();
}

function toggleClubAccess(id) {
  const c = C(id);
  if (!c) return;
  c.suspended = !c.suspended;
  saveClubCloud(c);
  haptic(c.suspended ? "warning" : "success");
  render();
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function initFirebase() {
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId || typeof firebase === "undefined") {
    return;
  }
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    try {
      db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
    } catch (e) {}

    // Динамическая проверка роли пользователя из Firestore (коллекция user_roles)
    const uid = getClientUserId();
    if (uid && !uid.startsWith("guest_")) {
      db.collection(COL_ROLES).doc(String(uid)).onSnapshot(doc => {
        if (doc && doc.exists) {
          const rData = doc.data() || {};
          if (rData.role === "sys") {
            S.authRole = "sys";
            S.role = "sys";
            scheduleRender();
          } else if (rData.role === "admin") {
            S.authRole = "admin";
            S.adminClubId = Number(rData.clubId) || 1;
            S.role = "admin";
            scheduleRender();
          }
        }
      }, () => {});
    }

    db.collection(COL_BOOKINGS).onSnapshot(snap => {
      fbLive = true;
      if (snap.empty && !seededBookings) {
        seededBookings = true;
        bk.forEach(item => saveBookingCloud(item));
      } else {
        const remote = [];
        snap.forEach(doc => remote.push(doc.data()));
        remote.sort((a, b) => (a.created || 0) - (b.created || 0) || String(a.id).localeCompare(String(b.id)));
        bk = remote;
      }
      scheduleRender();
    }, err => console.error("Firestore bookings error:", err));

    db.collection(COL_CLUBS).onSnapshot(snap => {
      if (snap.empty && !seededClubs) {
        seededClubs = true;
        clubs.forEach(c => saveClubCloud(c));
      } else {
        snap.forEach(doc => {
          const data = doc.data();
          const target = C(data.id);
          if (target) {
            target.ok = !!data.ok;
            target.gone = !!data.gone;
            if (typeof data.subPaid === "boolean") target.subPaid = data.subPaid;
            if (typeof data.suspended === "boolean") target.suspended = data.suspended;
          }
        });
      }
      scheduleRender();
    }, err => console.error("Firestore clubs error:", err));

    db.collection(COL_RATINGS).onSnapshot(snap => {
      const merged = { ...clubRatings };
      snap.forEach(doc => {
        const d = doc.data();
        if (d && d.clubId && d.uid && d.stars) {
          merged[doc.id] = d;
        }
      });
      clubRatings = merged;
      try {
        localStorage.setItem("nova_ratings_v1", JSON.stringify(clubRatings));
      } catch (e) {}
      scheduleRender();
    }, () => {});
  } catch (e) {
    console.error("Firebase init error:", e);
  }
}

setInterval(() => {
  const now = Date.now();
  let ch = false;
  bk.forEach(b => {
    if (b.st === "new" && b.created && b.created + 3e5 <= now) {
      b.st = "exp";
      ch = true;
      // Обновляем в облаке только владелец или админ, чтобы избежать шторма записей
      if (db && (S.role === "admin" || String(b.ownerId || "") === String(getClientUserId()))) {
        db.collection(COL_BOOKINGS).doc(String(b.id)).update({ st: "exp" }).catch(() => {});
      }
    }
  });
  if (ch && (S.role !== "user" || S.view === "home")) return render();
  document.querySelectorAll("[data-exp]").forEach(e => {
    const r = Math.max(0, +e.dataset.exp - now);
    e.textContent = String(Math.floor(r / 6e4)).padStart(2, "0") + ":" + String(Math.floor(r / 1e3) % 60).padStart(2, "0");
  });
}, 1000);

render();
initFirebase();
</script>
</body>
</html>
